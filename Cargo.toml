[workspace]
members = ["crates/ken-core", "crates/ken-cli", "crates/ken-models"]
resolver = "3"

[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.dependencies]
clap = { version = "=4.5.60", features = ["derive"] }
ureq = { version = "=3.4.2", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uzers = "=0.12.2"
libc = "=0.2.191"
tempfile = "=3.27.0"
sha2 = "=0.10.9"
