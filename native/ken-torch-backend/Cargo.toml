[package]
name = "ken-torch-backend"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ken-native-model-api = { path = "../../crates/ken-native-model-api" }
tch = { version = "=0.22.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
safetensors = "=0.3.3"
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"

[build-dependencies]
cc = "=1.9.0"
