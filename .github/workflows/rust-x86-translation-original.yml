name: Independent Intel CT2 original histories
on:
  push:
    branches: [codex/rust-migration]
    paths: ['.github/workflows/rust-x86-translation-original.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Admit only the previously unobserved Intel backend
        id: cpu
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          out=Path(os.environ['RUNNER_TEMP'])/'ct2-intel-original';out.mkdir(exist_ok=False)
          cpu=Path('/proc/cpuinfo').read_text();vendors=set(re.findall(r'^vendor_id\s*:\s*(\S+)',cpu,re.M))
          suitable=vendors=={'GenuineIntel'}
          (out/'CPUINFO.txt').write_text(cpu)
          (out/'CLAIM.json').write_text(json.dumps(dict(candidate=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],runner=os.environ['RUNNER_NAME'],vendors=sorted(vendors)),indent=2)+'\n')
          (out/'STATUS.json').write_text(json.dumps(dict(state='new-intel-profile-awaiting-observation'if suitable else 'different-hardware-no-original-executed',vendors=sorted(vendors)),indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a')as stream:stream.write('suitable='+str(suitable).lower()+'\n')
          PY
      - name: Claim the one permitted Intel observation
        id: lease
        if: steps.cpu.outputs.suitable == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ct2-intel-original-observation-lease
          path: ${{ runner.temp }}/ct2-intel-original/CLAIM.json
          overwrite: false
          if-no-files-found: error
          retention-days: 30
      - name: Retain allocations that did not acquire observation ownership
        if: steps.cpu.outputs.suitable == 'true' && steps.lease.outcome != 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          out=Path(os.environ['RUNNER_TEMP'])/'ct2-intel-original'
          (out/'STATUS.json').write_text(json.dumps(dict(state='no-observation-lease-no-original-executed'),indent=2)+'\n')
          PY
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.suitable == 'true' && steps.lease.outcome == 'success'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/restore-validation-fixtures
        if: steps.cpu.outputs.suitable == 'true' && steps.lease.outcome == 'success'
      - uses: astral-sh/setup-uv@v5
        if: steps.cpu.outputs.suitable == 'true' && steps.lease.outcome == 'success'
      - name: Prepare locked observer and registered translation data
        if: steps.cpu.outputs.suitable == 'true' && steps.lease.outcome == 'success'
        shell: bash
        run: |
          uv python install 3.12.9 --no-bin
          uv sync --locked --dev --python 3.12.9 --managed-python
      - name: Observe exactly the new Intel histories and retain their immediate journal
        if: steps.cpu.outputs.suitable == 'true' && steps.lease.outcome == 'success'
        shell: bash
        env:
          OBSERVATION_LEASE: ${{ steps.lease.outputs.artifact-id }}
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,platform,subprocess,sys
          from ken.model_assets import ModelAssets
          from tools.rust_migration.portable_reference import restore_portable
          from tools.rust_migration.x86_translation_reference import capture
          from tools.rust_migration.reference import reference_env
          from tools.rust_migration.execution_profiles import authenticate_frozen
          from tools.rust_migration.translation_cpu_prepare import registration
          from tools.rust_migration.native_json import identity
          import importlib.util
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'ct2-intel-original'
          assert not(root/'crates/ken-models/tests/fixtures/translation-linux-x86_64-mkl.json.gz').exists(),'Intel original already preserved; do not observe it again'
          claim=json.loads((out/'CLAIM.json').read_bytes())
          assert claim['candidate']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert os.environ['OBSERVATION_LEASE'].isdigit(),'one immutable observation lease required'
          restored=restore_portable(root,root/'docs/validation/rust-migration-2026-10-23/handoff',reference=root/'.ken/ct2-intel-reference',progress=root/'.ken/ct2-intel-history',python=Path(sys.executable))
          reference=restored.reference;authenticate_frozen(reference)
          package=Path(importlib.util.find_spec('ctranslate2').origin).parent.parent/'ctranslate2.libs'
          core=registration(root)['libraries']
          assert {name:identity(package/name)for name in core}==core,'registered original CT2/OpenMP bytes required'
          definition=json.loads((reference.root/'src/ken/embedder/data/es-en-ct2-int8.json').read_bytes())
          assets=ModelAssets.from_dict(definition['source']);source=assets.resolve(cache_dir=root/'.ken/ct2-intel-model',local_files_only=False);assets.verify(source)
          diagnostic='import ctranslate2,sys; t=ctranslate2.Translator(sys.argv[1],device="cpu",compute_type="int8",intra_threads=2,inter_threads=1); print(ctranslate2.__version__,t.compute_type,t.num_translators)'
          environment=reference_env(reference,root/'.ken/ct2-intel-constructor-environment');environment['CT2_VERBOSE']='1'
          result=subprocess.run([str(Path(sys.executable).absolute()),'-c',diagnostic,str(source)],env=environment,cwd=reference.root,capture_output=True,timeout=120)
          (out/'constructor.py').write_text(diagnostic+'\n');(out/'constructor.stdout').write_bytes(result.stdout);(out/'constructor.stderr').write_bytes(result.stderr)
          assert result.returncode==0 and b'MKL'in(result.stdout+result.stderr),'actual original Intel/MKL constructor required before observing histories'
          observed=capture(reference,source,out/'original')
          binding=dict(format='ken-x86-translation-backend-observation/1',backend='MKL',cpu_vendor='GenuineIntel',cpuinfo_sha256=hashlib.sha256((out/'CPUINFO.txt').read_bytes()).hexdigest(),
              candidate=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),observer_sha256=observed['observer_sha256'],reference_fingerprint=reference.fingerprint,
              runtime=observed['oracle']['runtime'],histories=len(observed['results']))
          binding['core_libraries']=core
          binding['lease_artifact_id']=int(os.environ['OBSERVATION_LEASE'])
          binding['allocation']=claim
          assert binding['histories']==29
          (out/'BINDING.json').write_text(json.dumps(binding,indent=2)+'\n')
          (out/'STATUS.json').write_text(json.dumps(dict(state='new-intel-original29-observed',accepted=False),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ct2-intel-original-${{ matrix.os }}-${{ matrix.replica }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ct2-intel-original/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
