name: Native Linux x86 model gates
on:
  push:
    branches: [codex/rust-migration]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'crates/ken-models/**'
      - 'crates/ken-native-model-api/**'
      - 'crates/ken-core/**'
      - 'crates/ken-retrieval/**'
      - 'crates/ken-text/**'
      - 'crates/ken-syntax/**'
      - 'native/ken-torch-backend/**'
      - 'tools/rust_migration/**'
      - 'tests/rust_migration/**'
      - '.github/actions/restore-validation-fixtures/**'
      - '.github/workflows/rust-runtime-cores.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-cpu-cores-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CMAKE_PARALLEL: '2'
      RUST_TEST_THREADS: '1'
      CARGO_TERM_COLOR: never
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/restore-validation-fixtures
      - uses: astral-sh/setup-uv@v5
      - name: Prepare locked CPU validation tools
        shell: bash
        run: |
          uv python install 3.12.9 --no-bin
          uv sync --locked --dev --extra torch --python 3.12.9 --managed-python
          uv pip install --python .venv/bin/python cmake==3.31.10
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          .venv/bin/python - <<'PY'
          import cmake, os, platform, sqlite3
          from pathlib import Path
          assert (platform.python_version(),sqlite3.sqlite_version)==('3.12.9','3.47.1')
          with open(os.environ['GITHUB_ENV'],'a')as stream:
              stream.write('CMAKE='+str(Path(cmake.__file__).parent/'data/bin/cmake')+'\n')
          PY
      - name: Prepare Linux build and process auditing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace zstd build-essential pkg-config
          mkdir -p .ken/rust-migration/native-core-build
          curl --fail --location --silent --show-error \
            https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.26/OpenBLAS-0.3.26.tar.gz \
            --output .ken/rust-migration/native-core-build/OpenBLAS-0.3.26.tar.gz
          .venv/bin/python -m tools.rust_migration.translation_build prepare-openblas \
            --archive "$PWD/.ken/rust-migration/native-core-build/OpenBLAS-0.3.26.tar.gz" \
            --destination "$PWD/.ken/rust-migration/native-core-build/openblas"
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import os
          from tools.rust_migration.preparation import PreparedTranslationBuild
          values=PreparedTranslationBuild(Path(os.environ['CMAKE']),Path.cwd()/'.ken/rust-migration/native-core-build/openblas').environment()
          with open(os.environ['GITHUB_ENV'],'a')as stream:
              for name,value in values.items():stream.write(name+'='+value+'\n')
          PY
      - name: Prepare authenticated native SDK data
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path native/ken-torch-backend/Cargo.toml
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import platform
          from tools.rust_migration.native_core_prepare import prepare_native_cores
          from tools.rust_migration.native_platform import native_target
          root=Path.cwd()
          prepare_native_cores(root,root/'.ken/rust-migration/native-core-archives',root/'.ken/rust-migration/native-core-sdk',target=native_target(platform.system(),platform.machine()))
          PY
      - name: Prepare pinned contextual model data
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json, os
          from ken.model_assets import ModelAssets
          from tools.rust_migration.context_reference import snapshot_state
          root=Path.cwd()
          definition=json.loads((root/'src/ken/embedder/data/code-context-int8.json').read_bytes())
          snapshot=ModelAssets.from_dict(definition).resolve(cache_dir=root/'.ken/rust-migration/context-data',local_files_only=False)
          snapshot_state(snapshot,definition)
          with open(os.environ['GITHUB_ENV'],'a')as stream:
              stream.write('KEN_CONTEXT_SNAPSHOT='+str(snapshot)+'\n')
          PY
      - name: Prepare pinned Ettin source data
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json, os
          from ken.model_assets import ModelAssets
          from tools.rust_migration.ettin_reference import source_state
          root=Path.cwd()
          definition=json.loads((root/'crates/ken-models/resources/ettin-68m-fp32.json').read_bytes())
          source=ModelAssets.from_dict(definition['source']).resolve(cache_dir=root/'.ken/rust-migration/ettin-data',local_files_only=False)
          source_state(source,definition['source'])
          with open(os.environ['GITHUB_ENV'],'a')as stream:
              stream.write('KEN_ETTIN_SOURCE='+str(source)+'\n')
          PY
      - name: Prepare authenticated x86 retrieval libraries
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json,numpy,os,shutil
          from tools.rust_migration.native_json import identity
          from tools.rust_migration.retrieval_validate import runtime_files
          from tools.rust_migration.grammar_prepare import prepare_grammars
          root=Path.cwd();base=root/'.ken/rust-migration/retrieval-data'
          dense=base/'dense-blas';dense.mkdir(parents=True)
          source=Path(numpy.__file__).parent.parent/'numpy.libs'
          for name,record in runtime_files(root,'x86_64').items():
              assert identity(source/name)==record,name
              shutil.copyfile(source/name,dense/name)
          grammar=base/'grammars'
          prepare_grammars(json.loads((root/'crates/ken-syntax/grammars.lock.json').read_bytes()),base/'archives',grammar)
          with open(os.environ['GITHUB_ENV'],'a')as stream:
              stream.write('KEN_DENSE_BLAS_DIR='+str(dense)+'\n')
              stream.write('KEN_GRAMMAR_MANIFEST='+str(grammar/'manifest.json')+'\n')
          PY
      - name: Prepare independent CPU capability probe
        shell: bash
        run: |
          mkdir -p .ken/rust-migration/execution-profiles
          rustc --edition=2024 crates/ken-models/tests/support/x86_features_probe.rs -o .ken/rust-migration/execution-profiles/x86-features-probe
          echo "KEN_X86_FEATURES_PROBE=$PWD/.ken/rust-migration/execution-profiles/x86-features-probe" >> "$GITHUB_ENV"
      - name: Execute and authenticate complete x86 models and symbol policies
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import os
          from tools.rust_migration.native_core_run import run_host
          from tools.rust_migration.native_core_evidence import verify_core_packet
          from tools.rust_migration.context_host import run_context_host, verify_context_host
          from tools.rust_migration.ettin_host import run_ettin_host, verify_ettin_host
          from tools.rust_migration.symbol_views_host import run_host as run_symbol_views, verify_host as verify_symbol_views
          from tools.rust_migration.symbol_preferences_host import run_host as run_preferences, verify_host as verify_preferences
          from tools.rust_migration.syntax_witnesses_host import run_host as run_syntax, verify_host as verify_syntax
          import json,platform
          root=Path.cwd();packet=root/'.ken/rust-migration/native-core-platform'
          packet.mkdir(parents=True,exist_ok=False)
          (packet/'CPU-ENVIRONMENT.json').write_text(json.dumps(dict(system=platform.platform(),machine=platform.machine(),cpuinfo=Path('/proc/cpuinfo').read_text()),indent=2)+'\n')
          from tools.rust_migration.execution_host import prepare_host
          prepare_host(root,packet,Path(os.environ['KEN_X86_FEATURES_PROBE']))
          run_host(root,root/'.ken/rust-migration/native-core-sdk',packet,root/'.ken/rust-migration/native-torch-target')
          errors=verify_core_packet(packet,root);assert not errors,errors
          from tools.rust_migration.symbol_profile_sequence import run_profiles,DEPENDENCIES
          def context():
              run_context_host(root,root/'.ken/rust-migration/native-core-sdk',Path(os.environ['KEN_CONTEXT_SNAPSHOT']),packet)
              errors=verify_context_host(packet,root);assert not errors,errors
          def ettin():
              run_ettin_host(root,root/'.ken/rust-migration/native-core-sdk',Path(os.environ['KEN_ETTIN_SOURCE']),packet)
              errors=verify_ettin_host(packet,root);assert not errors,errors
          def views():
              run_symbol_views(root,root/'.ken/rust-migration/native-core-sdk',Path(os.environ['KEN_ETTIN_SOURCE']),packet)
              errors=verify_symbol_views(packet,root);assert not errors,errors
          def preferences():
              run_preferences(root,packet)
              errors=verify_preferences(packet,root);assert not errors,errors
          def syntax():
              run_syntax(root,packet)
              errors=verify_syntax(packet,root);assert not errors,errors
          states=run_profiles(dict(context=context,ettin=ettin,views=views,preferences=preferences,syntax=syntax),dependencies=DEPENDENCIES|dict(syntax=('preferences',)))
          (packet/'PROFILE-STATES.json').write_text(json.dumps(states,indent=2)+'\n')
          print(json.dumps(states,indent=2))
          if any(row['state']!='passed'for row in states.values()):raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-cores-${{ runner.os }}-${{ runner.arch }}-${{ matrix.replica }}
          path: .ken/rust-migration/native-core-platform/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
