name: Rust native models and storage parity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Prepare the complete native validation workspace
        uses: ./.github/actions/prepare-native-validation
      - name: Freeze this checkout and measure its unchanged Python baseline
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from tools.rust_migration.reference import freeze_reference
          ref = freeze_reference(Path.cwd(), Path('.ken/rust-migration/m2/reference'))
          PY
          set +e
          .venv/bin/python -m pytest --junitxml=.ken/rust-migration/m2/python-baseline.xml > .ken/rust-migration/m2/python-baseline.log 2>&1
          printf '%s\n' "$?" > .ken/rust-migration/m2/python-baseline.exit
          .venv/bin/python -m mypy --no-incremental > .ken/rust-migration/m2/mypy-baseline.log 2>&1
          printf '%s\n' "$?" > .ken/rust-migration/m2/mypy-baseline.exit
          exit 0
      - name: Validate original integrity, all suites and31 native model/storage gates
        run: |
          native_build_args=(--cmake "$CMAKE")
          if [ "$RUNNER_OS" = 'Linux' ]; then
            native_build_args+=(--openblas-prefix "$KEN_TRANSLATION_OPENBLAS_PREFIX")
          fi
          .venv/bin/python -m tools.rust_migration.storage_validate \
            --reference .ken/rust-migration/m2/reference \
            --model-probe "$KEN_MODEL_PROBE" --potion-snapshot "$KEN_POTION_SNAPSHOT" \
            --table-probe "$KEN_TABLE_PROBE" --context-probe "$KEN_CONTEXT_PROBE" \
            --context-snapshot "$KEN_CONTEXT_SNAPSHOT" --library "$KEN_ORT_LIBRARY" \
            --ettin-probe "$KEN_ETTIN_PROBE" --ettin-source "$KEN_ETTIN_SOURCE" \
            --native "$KEN_TRANSLATION_PROBE" --source "$KEN_TRANSLATION_SOURCE" \
            --policy-probe "$KEN_POLICY_PROBE" --storage-probe "$KEN_STORAGE_PROBE" \
            --artifact src/ken/embedder/data/ken__static-qwen3-r512-v2.npz \
            --baseline-dir .ken/rust-migration/m2 \
            --original-manifest .ken/rust-migration/m2/reference/reference-manifest.json \
            --out .ken/rust-migration/m2-storage/validation "${native_build_args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-models-${{ runner.os }}
          path: .ken/rust-migration/m2-storage/validation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  matrix:
    needs: static
    if: always()
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.ken/rust-migration/validation-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: rust-models-*
          path: .ken/rust-migration/m2/platforms
      - name: Require matching platform receipts
        run: |
          uv run --no-project --python 3.12.9 --managed-python python -m tools.rust_migration.storage_validate \
            --scope matrix --platform-receipts .ken/rust-migration/m2/platforms \
            --out .ken/rust-migration/m2/matrix
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-models-matrix
          path: .ken/rust-migration/m2/matrix/
          include-hidden-files: true
          if-no-files-found: error
