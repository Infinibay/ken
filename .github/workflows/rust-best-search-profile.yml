name: Independent BestSearch SkylakeX diagnostic
on:
  push:
    branches: [codex/rust-migration]
    paths: ['.github/workflows/rust-best-search-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Prepare locked observer and independent capability probe
        shell: bash
        run: |
          uv python install 3.12.9 --no-bin
          uv sync --locked --dev --extra torch --python 3.12.9 --managed-python
          rustup toolchain install 1.95.0 --profile minimal
          mkdir -p .ken/best-search-profile
          rustc +1.95.0 --edition=2024 crates/ken-models/tests/support/x86_features_probe.rs -o .ken/best-search-profile/x86-features-probe
      - name: Admit only the previously unobserved BestSearch profile
        id: profile
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          from tools.rust_migration.execution_host import detect_profiles,record_profiles
          from tools.rust_migration.native_json import identity
          from tools.rust_migration.retrieval_validate import runtime_files
          import numpy
          root=Path.cwd();out=root/'.ken/best-search-profile';probe=out/'x86-features-probe'
          caps,alignment=detect_profiles(probe,repo=root)
          (out/'DETECTED.json').write_text(json.dumps(dict(candidate=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),capabilities=caps,alignment=alignment,probe=identity(probe),cpuinfo=Path('/proc/cpuinfo').read_text()),indent=2)+'\n')
          wanted=dict(context='4fd097c7c15ded15e3459b7ae1aabe90f9d2c6d3618857ae0be8e4f51bb6a1f0',alignment='1f613df12b1b50d20bbbcbea3874c319df639385860269282ab78f6fe32f456d')
          try:
              record=record_profiles(root,out,caps,alignment)
              suitable={k:r['id']for k,r in record['references'].items()}==wanted
          except ValueError:
              suitable=False
          if suitable:
              libraries=Path(numpy.__file__).parent.parent/'numpy.libs'
              for name,pin in runtime_files(root,'x86_64').items():assert identity(libraries/name)==pin,name
          (out/'STATUS.json').write_text(json.dumps(dict(state='new-profile-awaiting-observation'if suitable else 'different-hardware-no-original-executed',wanted=wanted),indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a')as stream:stream.write('suitable='+str(suitable).lower()+'\n')
          PY
      - uses: ./.github/actions/restore-validation-fixtures
        if: steps.profile.outputs.suitable == 'true'
      - name: Prepare only the three registered model sources
        if: steps.profile.outputs.suitable == 'true'
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json
          from ken.model_assets import ModelAssets
          from tools.rust_migration.best_search_reference import registrations
          root=Path.cwd();base=root/'.ken/best-search-profile';sources={}
          for name,entry in registrations(root).items():
              spec=entry['source']if name=='ettin'else entry
              assets=ModelAssets.from_dict(spec)
              source=assets.resolve(cache_dir=root/'.ken/best-search-profile-models'/name,local_files_only=False)
              assets.verify(source);sources[name]=str(source)
          (base/'SOURCES.json').write_text(json.dumps(sources,indent=2)+'\n')
          PY
      - name: Observe exactly three previously unobserved profile compositions
        if: steps.profile.outputs.suitable == 'true'
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import gzip,hashlib,json,subprocess,sys
          from tools.rust_migration.portable_reference import restore_portable
          from tools.rust_migration.execution_profiles import authenticate_frozen,FP
          from tools.rust_migration.reference import reference_env
          from tools.rust_migration.best_search_reference import SCRIPT,cases,registrations,FIXTURE,API_SHA
          root=Path.cwd();base=root/'.ken/best-search-profile';out=base/'observation';out.mkdir(exist_ok=False)
          restored=restore_portable(root,root/'docs/validation/rust-migration-2026-10-23/handoff',reference=root/'.ken/best-search-profile-original',progress=root/'.ken/best-search-profile-history',python=Path(sys.executable))
          reference=restored.reference;authenticate_frozen(reference)
          selected=[row for row in cases()if row['models']=='registered']
          assert [r['id']for r in selected]==['registered-symbol','registered-class','registered-file']
          request=dict(reference=str(reference.root),cases=selected,catalog_root=str(out/'catalogs'),result=str(out/'observations.json'),registrations=registrations(root),sources=json.loads((base/'SOURCES.json').read_bytes()))
          (out/'capture.py').write_text(SCRIPT);(out/'inputs.json').write_text(json.dumps(request,ensure_ascii=True)+'\n')
          environment=reference_env(reference,out/'environment');environment['KEN_CACHE_DIR']=str(root/'.ken/best-search-profile-model-cache')
          result=subprocess.run([str(Path(sys.executable).absolute()),'-B',str(out/'capture.py'),str(out/'inputs.json')],cwd=reference.root,env=environment,capture_output=True,timeout=600)
          (out/'stdout.log').write_bytes(result.stdout);(out/'stderr.log').write_bytes(result.stderr)
          assert result.returncode==0,'original observer failed; stdout/stderr preserved'
          authenticate_frozen(reference);raw=json.loads((out/'observations.json').read_bytes())
          baseline=json.loads(gzip.decompress((root/FIXTURE).read_bytes()))
          for key in('format','runtime','registrations','original_source_sha256'):assert raw[key]==baseline[key],key
          assert raw['original_source_sha256']==API_SHA
          assert [json.loads(line)for line in(out/'records.jsonl').read_text().splitlines()]==raw['cases']
          assert [row['id']for row in raw['cases']]==[row['id']for row in selected]
          original_rows={row['id']:row for row in baseline['cases']}
          for row in raw['cases']:
              assert row['input']==original_rows[row['id']]['input'],row['id']
              assert len(row['events'])==2 and all('result'in event and'error'not in event for event in row['events'])
          binding=dict(format='ken-best-search-profile-observation/1',reference_fingerprint=FP,observer_sha256=hashlib.sha256(SCRIPT.encode()).hexdigest(),base_fixture_sha256=hashlib.sha256((root/FIXTURE).read_bytes()).hexdigest(),profiles=json.loads((base/'EXECUTION-PROFILES.json').read_bytes()),case_ids=[row['id']for row in selected])
          (out/'BINDING.json').write_text(json.dumps(binding,indent=2)+'\n')
          (base/'STATUS.json').write_text(json.dumps(dict(state='three-new-profile-compositions-observed',accepted=False,note='Independent original evidence only; compare with the failing native result before choosing any correction.'),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: best-search-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ken/best-search-profile/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
