name: Native source-piece gates

on:
  push:
    branches: [codex/rust-migration]
    paths:
      - '.github/workflows/rust-pieces.yml'
      - '.github/actions/prepare-piece-validation/**'
      - 'crates/ken-retrieval/**'
      - 'crates/ken-core/**'
      - 'tools/rust_migration/piece*'
      - 'tools/rust_migration/portable_reference.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-pieces-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: ./.github/actions/prepare-piece-validation
      - name: Execute the complete affected native suites
        shell: bash
        run: |
          output=.ken/rust-migration/piece-platform/gates
          mkdir -p "$output"
          cargo test --locked --offline -p ken-core -p ken-retrieval --all-targets -- --list > "$output/rust-list.log" 2>&1
          cargo test --locked --offline -p ken-core -p ken-retrieval --all-targets --no-fail-fast > "$output/rust-tests.log" 2>&1
      - name: Execute all affected tooling and preserve discovery
        shell: bash
        run: |
          output=.ken/rust-migration/piece-platform/gates
          tests=(
            tests/rust_migration/test_portable_reference.py
            tests/rust_migration/test_reference.py
            tests/rust_migration/test_numeric_evidence.py
            tests/rust_migration/test_numeric_reference.py
            tests/rust_migration/test_dense_runtime.py
            tests/rust_migration/test_translation_build.py
            tests/rust_migration/test_piece_reference.py
            tests/rust_migration/test_retrieval_validate.py
            tests/rust_migration/test_retrieval_evidence.py
            tests/rust_migration/test_selection_evidence.py
          )
          .venv/bin/python -m pytest -o addopts= --collect-only -q "${tests[@]}" > "$output/python-list.log" 2>&1
          .venv/bin/python -m pytest -o addopts= -q "${tests[@]}" --junitxml="$output/python.xml" > "$output/python-tests.log" 2>&1
      - name: Require formatting and strict native lint
        shell: bash
        run: |
          output=.ken/rust-migration/piece-platform/gates
          cargo fmt --all --check > "$output/fmt.log" 2>&1
          cargo clippy --locked --offline -p ken-core -p ken-retrieval --all-targets -- -D warnings > "$output/clippy.log" 2>&1
      - name: Record source and executable identities
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json, os
          from tools.rust_migration.index_validate import source_identity
          from tools.rust_migration.native_json import identity
          root=Path.cwd(); output=root/'.ken/rust-migration/piece-platform'
          (output/'SOURCES.json').write_text(json.dumps(source_identity(root),indent=2)+'\n')
          binaries={str(p.relative_to(root)):identity(p) for p in (root/'target/debug/deps').glob('*') if p.is_file() and os.access(p,os.X_OK)}
          (output/'BINARIES.json').write_text(json.dumps(binaries,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-pieces-${{ runner.os }}-${{ runner.arch }}
          path: .ken/rust-migration/piece-platform/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
