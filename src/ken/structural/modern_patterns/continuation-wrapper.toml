query_language = "kql/2"
id = "architecture.continuation-wrapper"
name = "Continuation Wrapper"
description = "A factory returns a nested callable that invokes the continuation received by the factory."
collections = ["architecture", "modern"]
tags = ["composition", "closure", "web"]
caveat = "A structural building block of middleware and functional decorators, not proof of registration with a web framework. Requires no explicit write to the continuation binding; does not establish argument forwarding, order, exactly-once invocation, hidden rebinding or API identity."
query = '''
language "kql/2";
module ken.catalog.architecture.continuation_wrapper;

pattern detect(out Callable $factory, out Callable $handler, out Parameter $continuation) {
  callable $factory {
    parameters { param $continuation { reassigned: false; } }
    callable $handler {
      body { call $continuation {}; }
    }
    body { return $handler; }
  }
}

query results {
  use detect(factory: $factory, handler: $handler, continuation: $continuation);
  select $factory, $handler, $continuation;
}
'''
