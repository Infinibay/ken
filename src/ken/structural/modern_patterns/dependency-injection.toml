query_language = "kql/2"
id = "architecture.dependency-injection"
name = "Dependency Injection"
description = "An object receives a collaborator or callable in a field and uses it from a distinct method."
collections = ["architecture", "modern"]
tags = ["composition", "dependency-injection", "web"]
caveat = "Structural supply/use evidence, not a composition root, container, lifetime or runtime identity guarantee. Object assignment requires one explicit field write in the injecting method and an unreassigned supplied parameter. Conditional supply is admitted; all-path retention, descriptor behavior and temporal order between methods remain unproven."
query = '''
language "kql/2";
module ken.catalog.architecture.dependency_injection;
import ken.catalog.architecture.dependency_injection.variants.callable_input;
import ken.catalog.architecture.dependency_injection.variants.object_assignment;

pattern detect(out TypeDecl $unit, out Field $dependency, out Callable $inject, out Callable $operation) {
  either {
    use ken.catalog.architecture.dependency_injection.variants.object_assignment.detect(unit: $unit, dependency: $dependency, inject: $inject, operation: $operation);
  } or {
    use ken.catalog.architecture.dependency_injection.variants.callable_input.detect(unit: $unit, dependency: $dependency, inject: $inject, operation: $operation);
  }
}

query results {
  use detect(unit: $unit, dependency: $dependency, inject: $inject, operation: $operation);
  select $unit, $dependency, $inject, $operation;
}
'''

[[variants]]
id = "retained-object"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp"]
query_claim = "Opt-in precision contract: the supplied object is the final supported source input to the delegated field, or a supported constructor input. Conditional configuration may be unsupported; descriptor behavior and field identity between methods remain unproven. The parent also admits conditional supply with a unique explicit field write."
query = '''
language "kql/2";
module ken.catalog.architecture.dependency_injection.variants.retained_object;
import ken.catalog.strategy.supplied_policy;

pattern detect(out TypeDecl $unit, out Field $dependency, out Callable $inject, out Callable $operation) {
  use ken.catalog.strategy.supplied_policy.detect(unit: $unit, configure: $inject, policy: $dependency);
  type $unit {
    method $operation {
      call $invocation {}
      body { call $invocation { receiver: $dependency; }; }
    }
  }
  where $inject != $operation;
}

query results {
  use detect(unit: $unit, dependency: $dependency, inject: $inject, operation: $operation);
  select $unit, $dependency, $inject, $operation;
}
'''

[[variants]]
id = "object-assignment"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp"]
query_claim = "A supplied parameter reaches the only explicit write to the field in the injecting method, then a distinct method delegates through that field. Conditional supply is allowed; hidden writes, aliases and cross-method ordering remain outside this contract."
query = '''
language "kql/2";
module ken.catalog.architecture.dependency_injection.variants.object_assignment;

pattern detect(out TypeDecl $unit, out Field $dependency, out Callable $inject, out Callable $operation) {
  type $unit {
    field $dependency {}
    method $inject {
      writes: exactly($dependency, 1);
      parameters { param $supplied { reassigned: false; } }
      body { $dependency = $supplied; }
    }
    method $operation {
      call $invocation {}
      body { call $invocation { receiver: $dependency; }; }
    }
  }
  where $inject != $operation;
}

query results {
  use detect(unit: $unit, dependency: $dependency, inject: $inject, operation: $operation);
  select $unit, $dependency, $inject, $operation;
}
'''

[[variants]]
id = "callable-input"
status = "ready"
languages = ["python", "javascript", "typescript", "go", "csharp", "cpp", "rust"]
query_claim = "A supplied callable has a last supported source write or constructor input and is invoked through that field from a distinct method; descriptor behavior, heap stability and call order are not proved."
query = '''
language "kql/2";
module ken.catalog.architecture.dependency_injection.variants.callable_input;
import ken.catalog.strategy.supplied_policy;

pattern detect(out TypeDecl $unit, out Field $dependency, out Callable $inject, out Callable $operation) {
  use ken.catalog.strategy.supplied_policy.detect(unit: $unit, configure: $inject, policy: $dependency);
  type $unit {
    method $operation {
      body { call $dependency {}; }
    }
  }
  where $inject != $operation;
}

query results {
  use detect(unit: $unit, dependency: $dependency, inject: $inject, operation: $operation);
  select $unit, $dependency, $inject, $operation;
}
'''
