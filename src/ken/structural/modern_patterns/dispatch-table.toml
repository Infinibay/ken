query_language = "kql/2"
id = "architecture.dispatch-table"
name = "Dispatch Table"
description = "Registers supplied callables by key and invokes an indexed entry of the same stored table."
collections = ["architecture", "modern"]
tags = ["dispatch", "registry", "web"]
caveat = "Structural dispatch registry, not proof of HTTP routing or event delivery. Does not prove that a runtime key was registered, handler lifetime, authorization or thread safety. Indexed getter/setter overloads may change runtime behavior."
query = '''
language "kql/2";
module ken.catalog.architecture.dispatch_table;
import ken.catalog.architecture.dispatch_table.variants.adapted;
import ken.catalog.architecture.dispatch_table.variants.direct;

pattern detect(out GraphTerm $unit, out GraphTerm $register, out GraphTerm $dispatch, out GraphTerm $table) {
  either {
    use ken.catalog.architecture.dispatch_table.variants.direct.detect(unit: $unit, register: $register, dispatch: $dispatch, table: $table);
  } or {
    use ken.catalog.architecture.dispatch_table.variants.adapted.detect(unit: $unit, register: $register, dispatch: $dispatch, table: $table);
  }
}

query results {
  use detect(unit: $unit, register: $register, dispatch: $dispatch, table: $table);
  select $unit, $register, $dispatch, $table;
}
'''

[[variants]]
id = "direct"
status = "ready"
query_claim = "Registro indexado en un campo del propio tipo y despacho que invoca el elemento de ese mismo campo en la clave pedida. El cuerpo del registro nombra la coleccion en la que escribe, asi que la insercion liga el almacen y el selector de campo solo lo confirma: la forma KQL 2 pura cabe en el presupuesto adversario del catalogo. Ver docs/design/kql2/catalog-extensions.md (5.77)."
query = '''
language "kql/2";
module ken.catalog.architecture.dispatch_table.variants.direct;

pattern detect(out GraphTerm $unit, out GraphTerm $register, out GraphTerm $dispatch, out Field $table) {
  type $unit {
    method $register {
      arity: 2;
      param $key { }
      param $handler { }
      body { insert $handler into $table at $key writes: 1; }
    }
    method $dispatch {
      arity: 2;
      param $requested { }
      body { call $table[$requested] { } as $call; }
    }
    field $table { }
  }
  where $key != $handler;
  where $register != $dispatch;
}

query results {
  use detect(unit: $unit, register: $register, dispatch: $dispatch, table: $table);
  select $unit, $register, $dispatch, $table;
}
'''

[[variants]]
id = "adapted"
status = "ready"
languages = ["python", "javascript", "typescript"]
query_claim = "Registro en la ranura heredada del propio tipo y despacho que resuelve una entrada derivada de la peticion, la pasa por un adaptador que devuelve lo que recibio y invoca su resultado. La sintaxis de retorno del adaptador relaciona su entrada con su salida; no se prueba la preservacion en ejecucion, la pureza de los getters ni los overrides efectivos del despacho. Ver docs/design/kql2/catalog-extensions.md (5.78)."
query = '''
language "kql/2";
module ken.catalog.architecture.dispatch_table.variants.adapted;

pattern detect(out GraphTerm $unit, out GraphTerm $register, out GraphTerm $dispatch, out Field $table) {
  type $owner {
    field $registration_slot { effective: true; declaration: $table; }
    method $register {
      param $slot_key { position: 0; }
      param $handler { position: 1; }
      body { insert $handler into $registration_slot at $slot_key writes: 1; }
    }
  }
  type $unit {
    field $dispatch_slot { effective: true; declaration: $table; }
    method $dispatch {
      arity: 2;
      param $requested { position: 0; }
      body {
        let $adapted = call $normalizer { argument $dispatch_slot[$lookup_key] at 0; } as $entry;
        call $adapted { } as $invocation;
      }
    }
  }
  callable $normalizer { arity: 1; param $input { } }
  where subtype($unit, $owner);
  where effective($unit, $register);
  where preserves($normalizer, $input);
  where $register != $dispatch;
  either { where $lookup_key == $requested; }
  or { where access_input($lookup_key, $requested); }
}

query results {
  use detect(unit: $unit, register: $register, dispatch: $dispatch, table: $table);
  select $unit, $register, $dispatch, $table;
}
'''
