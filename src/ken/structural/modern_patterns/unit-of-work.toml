query_language = "kql/2"
id = "persistence.unit-of-work"
name = "Unit of Work"
description = "Registers entities in keyed change batches and coordinates at least two persistence actions over those batches on one store."
collections = ["modern", "persistence"]
tags = ["web", "persistence", "deferred-writes"]
caveat = "Deferred-change structural signature using explicit collection and persistence API shapes. Does not prove a database driver, atomic transaction, rollback, order, alias stability, execution, or correspondence of runtime registered and consumed keys. A batch processor can share this signature."
query = '''
language "kql/2";
module ken.catalog.persistence.unit_of_work;
import ken.catalog.persistence.unit_of_work.variants.keyed_change_set;

pattern detect(out GraphTerm $unit, out GraphTerm $flush, out GraphTerm $store) {
  use ken.catalog.persistence.unit_of_work.variants.keyed_change_set.detect(unit: $unit, flush: $flush, store: $store);
}

query results {
  use detect(unit: $unit, flush: $flush, store: $store);
  select $unit, $flush, $store;
}
'''

[[variants]]
id = "keyed-change-set"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp"]
query = '''
language "kql/2";
module ken.catalog.persistence.unit_of_work.variants.keyed_change_set;
import ken.catalog.persistence.unit_of_work.keyed_flush;

pattern detect(out GraphTerm $unit, out GraphTerm $flush, out GraphTerm $store) {
  type $unit {
    field $changes {}
    method $register { constructor: false; }
  }
  method $register {
    static: false;
    parameters { param $entity {} param $key {} }
    body {
      let $batch = call $lookup { receiver: $changes; name: ["get", "GetValueOrDefault"]; resolution: unresolved; };
      insert $entity into $batch;
      insert $batch into $changes at $key;
    }
  }
  where $key != $entity;
  use ken.catalog.persistence.unit_of_work.keyed_flush.detect(unit: $unit, changes: $changes, flush: $flush, store: $store);
  where $register != $flush;
  at least 2 distinct $action {
    use ken.catalog.persistence.unit_of_work.keyed_flush.detect(unit: $unit, changes: $changes, flush: $flush, store: $store, action: $action);
  };
}


query results {
  use detect(unit: $unit, flush: $flush, store: $store);
  select $unit, $flush, $store;
}
'''

[[operations]]
id = "keyed_flush"
status = "ready"
description = "Expose a coordinator's resolved worker, keyed batch iteration, item, store and persistence action."
caveat = "Uses collection and persistence API shapes with possible assignment provenance, not transaction or runtime execution guarantees."
query = '''
language "kql/2";
module ken.catalog.persistence.unit_of_work.keyed_flush;

pattern detect(out GraphTerm $unit, out GraphTerm $changes, out GraphTerm $flush, out GraphTerm $worker, out GraphTerm $iteration, out GraphTerm $item, out GraphTerm $store, out GraphTerm $action, out Call $effect) {
  type $unit {
    field $changes {}
    field $store {}
    method $worker { constructor: false; }
    method $flush { constructor: false; }
  }
  where $changes != $store;
  where $flush != $worker;
  method $flush { call $delegate { target: $worker; entry: $changes; } }
  method $worker {
    body {
      let $batch = call $lookup { receiver: $changes; name: ["get", "GetValueOrDefault"]; resolution: unresolved; };
      iterate $batch as $item as $iteration {
        origin: $lookup;
        body {
          call on $store {
            name: $action in ["insert", "update", "modify", "delete", "save", "Insert", "Update", "Modify", "Delete", "Save"];
            argument $item at 0;
            resolution: unresolved;
          } as $effect;
        }
      }
    }
  }
}

query results {
  use detect(unit: $unit, changes: $changes, flush: $flush, worker: $worker, iteration: $iteration, item: $item, store: $store, action: $action, effect: $effect);
  select $unit, $changes, $flush, $worker, $iteration, $item, $store, $action, $effect;
}
'''

