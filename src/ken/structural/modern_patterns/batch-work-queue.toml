query_language = "kql/2"
id = "architecture.batch-work-queue"
name = "Batch Work Queue"
description = "Stores supplied work items and activates them from another method before an explicit same-block collection reset."
collections = ["modern", "architecture"]
tags = ["web", "batch", "deferred-work"]
caveat = "Structural batch-work shape; does not prove FIFO, exactly-once delivery, termination, successful execution, atomic draining, alias stability or API identity. One-shot callbacks can share this shape."
query = '''
language "kql/2";
module ken.catalog.architecture.batch_work_queue;
import ken.catalog.architecture.batch_work_queue.drain;

pattern detect(out GraphTerm $unit, out GraphTerm $queue, out GraphTerm $consume) {
  use ken.catalog.architecture.batch_work_queue.drain.detect(unit: $unit, queue: $queue, consume: $consume);
}

query results {
  use detect(unit: $unit, queue: $queue, consume: $consume);
  select $unit, $queue, $consume;
}
'''

[[variants]]
id = "stored-batch"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp"]
