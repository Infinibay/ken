id = "architecture.batch-work-queue"
name = "Batch Work Queue"
description = "Stores supplied work items and activates them from another method before an explicit same-block collection reset."
collections = ["modern", "architecture"]
tags = ["web", "batch", "deferred-work"]
caveat = "Structural batch-work shape; does not prove FIFO, exactly-once delivery, termination, successful execution, atomic draining, alias stability or API identity. One-shot callbacks can share this shape."
query = '''
query batch_work_queue {
 match "architecture.batch-work-queue.drain"(unit:$unit,queue:$queue,consume:$consume);
 emit $unit, $queue, $consume;
}
'''

[[variants]]
id = "stored-batch"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp"]
query = '''
query stored_batch {
 match "architecture.batch-work-queue.drain"(unit:$unit,queue:$queue,consume:$consume);
 emit $unit, $queue, $consume;
}
'''

[[operations]]
id = "drain"
status = "ready"
description = "Expose registration, iteration, item activation and subsequent reset of the same collection field."
caveat = "Same-block lexical reset evidence, not a runtime consumption or progress guarantee. Clear/Clear calls are API shapes."
query = '''
query drain {
 require $unit HAS_FIELD $queue;
 require $unit HAS_METHOD $register;
 require $register HAS_PARAMETER $input;
 parameter(receiver: false) as $input;
 require $register HAS_CALL $insert;
 require $insert INSERTS_INTO $queue;
 require $insert INSERTED_INPUT $input;
 require $unit HAS_METHOD $consume;
 different $register $consume;
 require $consume HAS_OPERATION $iteration;
 require $iteration ITERATION_SOURCE $queue;
 require $iteration ITERATION_BINDING $item [role: value];
 require $iteration ITERATION_INVOKES_VALUE $dispatch;
 require $dispatch RECEIVER $item;
 call(explicit_arguments: 0) as $dispatch;
 require $consume HAS_OPERATION $statement;
 require $statement DISCARDS_RESULT $dispatch;
 require $reset CLEARS_COLLECTION $queue;
 require $reset AFTER_ITERATION $iteration;
 emit $unit, $queue, $register, $input, $consume, $iteration, $item, $dispatch, $reset;
}
'''
