[[operations]]
id = "drain"
status = "ready"
description = "Expose registration, iteration, item activation and subsequent reset of the same collection field."
caveat = "Same-block lexical reset evidence, not a runtime consumption or progress guarantee. Clear/Clear calls are API shapes."
query = '''
language "kql/2";
module ken.catalog.architecture.batch_work_queue.drain;

pattern detect(out GraphTerm $unit, out GraphTerm $queue, out GraphTerm $register, out GraphTerm $input, out GraphTerm $consume, out GraphTerm $iteration, out GraphTerm $item, out Call $dispatch, out GraphTerm $reset) {
  type $unit {
    field $queue {}
    method $register { constructor: false; param $input {} }
    method $consume { constructor: false; }
  }
  where $register != $consume;
  method $register {
    body {
      insert $input into $queue as $local_insert;
    }
  }
  method $consume {
    body {
      iterate $queue as $item as $iteration {
        body {
          call on $item { discarded: true; } as $dispatch;
        }
      }
    }
  }
  method $consume {
    body {
      clear $queue after $iteration as $reset;
    }
  }
  where $dispatch.explicit_arguments == 0;
}

query results {
  use detect(unit: $unit, queue: $queue, register: $register, input: $input, consume: $consume, iteration: $iteration, item: $item, dispatch: $dispatch, reset: $reset);
  select $unit, $queue, $register, $input, $consume, $iteration, $item, $dispatch, $reset;
}
'''
