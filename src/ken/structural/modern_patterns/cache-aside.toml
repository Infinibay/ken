query_language = "kql/2"
id = "architecture.cache-aside"
name = "Cache-Aside"
description = "Correlates lookup, miss-triggered loading, write-back and return through an explicit null test or a Java Optional supplier/consumer chain."
collections = ["architecture", "modern"]
tags = ["web", "cache", "persistence"]
caveat = "API-shape candidate: get/Get and put/set/Set names do not resolve a cache contract or persistent store. Java Optional requires an unshadowed explicit import; other classpath resolution is not modeled. Null comparison may be overloaded. Null-miss uses explicit write counts, stable key/cache bindings, bounded CFG paths and possible return origins; Java Optional retains its earlier flow-insensitive assignment evidence. Neither proves hidden effects, alias stability, freshness, invalidation, TTL, single-flight or thread safety. Serialized, awaited, indexed and sentinel-based variants remain unsupported."
query = '''
language "kql/2";
module ken.catalog.architecture.cache_aside;
import ken.catalog.architecture.cache_aside.variants.java_optional;
import ken.catalog.architecture.cache_aside.variants.null_miss;

pattern detect(out GraphTerm $unit, out GraphTerm $cache, out GraphTerm $key, out GraphTerm $lookup, out GraphTerm $load, out GraphTerm $write) {
  either {
    use ken.catalog.architecture.cache_aside.variants.null_miss.detect(unit: $unit, cache: $cache, key: $key, lookup: $lookup, load: $load, write: $write);
  } or {
    use ken.catalog.architecture.cache_aside.variants.java_optional.detect(unit: $unit, cache: $cache, key: $key, lookup: $lookup, load: $load, write: $write);
  }
}

query results {
  use detect(unit: $unit, cache: $cache, key: $key, lookup: $lookup, load: $load, write: $write);
  select $unit, $cache, $key, $lookup, $load, $write;
}
'''

[[variants]]
id = "java-optional"
status = "ready"
query = '''
language "kql/2";
module ken.catalog.architecture.cache_aside.variants.java_optional;

pattern detect(out GraphTerm $unit, out GraphTerm $cache, out GraphTerm $key, out GraphTerm $lookup, out GraphTerm $load, out GraphTerm $write) {
  callable $unit {
    param $cache { reassigned: false; }
    param $key { reassigned: false; }
    callable $supplier {
      var $loaded { }
      body {
        call $load { name: ["load"]; argument $key at 0; };
        call $loaded_optional { wraps: $load; argument $load at 0; };
        call on $loaded { present: $consumer; };
        return $loaded;
      }
      callable $consumer {
        param $item { }
        body {
          call $write { receiver: $cache; name: ["set", "put", "Set"]; argument $key at 0; argument $item at 1; };
        }
      }
    }
    body {
      call $lookup { receiver: $cache; name: ["get", "Get"]; argument $key at 0; };
      call $boxed { wraps: $lookup; argument $lookup at 0; };
      call $choice { empty: $supplier; argument $supplier at 0; };
      call on $choice { fallback: "NULL"; returned: true; };
    }
  }
}

query results {
  use detect(unit: $unit, cache: $cache, key: $key, lookup: $lookup, load: $load, write: $write);
  select $unit, $cache, $key, $lookup, $load, $write;
}
'''

[[variants]]
id = "null-miss"
status = "ready"
query_claim = "Lookup and load are the only two explicit writes to the tested binding. A hit path returns the lookup origin; a miss path loads before write-back and returns the load origin. Possible origins at joins are admitted explicitly; this is not a must-on-all-paths or runtime API guarantee."
query = '''
language "kql/2";
module ken.catalog.architecture.cache_aside.variants.null_miss;

pattern detect(out GraphTerm $unit, out GraphTerm $cache, out GraphTerm $key, out GraphTerm $lookup, out GraphTerm $load, out GraphTerm $write) {
  callable $unit {
    param $cache { reassigned: false; }
    param $key { reassigned: false; }
    var $cached { }
    writes: exactly($cached, 2);
    body {
      let $looked = call $lookup { receiver: $cache; name: ["get", "Get"]; argument $key at 0; };
      if ($cached == null) {
        let $filled = call $load { argument $key at 0; };
        call $write {
          receiver: $cache;
          name: ["put", "set", "Set"];
          argument $key at 0;
          argument $cached at 1;
          argument $filled at 1;
        };
      }
      return $cached;
    }
  }
  where $lookup != $load;
}

query results {
  use detect(unit: $unit, cache: $cache, key: $key, lookup: $lookup, load: $load, write: $write);
  select $unit, $cache, $key, $lookup, $load, $write;
}
'''
