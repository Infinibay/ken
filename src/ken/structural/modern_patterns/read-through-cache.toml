query_language = "kql/2"
id = "architecture.read-through-cache"
name = "Read-Through Cache"
description = "An object creates cache storage and exposes hit-return / miss-load-fill-return retrieval."
collections = ["architecture", "modern"]
tags = ["web", "cache", "persistence"]
caveat = "API-shape and local-construction evidence, not runtime ownership or cache/store identity. Does not prove TTL, eviction, invalidation, purity, alias stability, concurrency safety or atomic contains/get."
query = '''
language "kql/2";
module ken.catalog.architecture.read_through_cache;
import ken.catalog.architecture.read_through_cache.read_fill;

pattern detect(out GraphTerm $unit, out GraphTerm $read, out GraphTerm $cache, out GraphTerm $key, out GraphTerm $lookup, out GraphTerm $load, out GraphTerm $write) {
  use ken.catalog.architecture.read_through_cache.read_fill.detect(read: $read, cache: $cache, key: $key, lookup: $lookup, load: $load, write: $write);
  type $unit {
    field $cache { }
    method $read { }
    method $local_initialize {
      constructor: true;
      body {
        let $created = construct $local_storage_type {} as $local_construction;
        $cache = $created;
      }
    }
  }
}

query results {
  use detect(unit: $unit, read: $read, cache: $cache, key: $key, lookup: $lookup, load: $load, write: $write);
  select $unit, $read, $cache, $key, $lookup, $load, $write;
}
'''

[[operations]]
id = "read_fill"
status = "ready"
description = "Presence-test hit returns lookup; a false CFG path loads, stores and returns the loaded origin with stable explicit bindings."
query = '''
language "kql/2";
module ken.catalog.architecture.read_through_cache.read_fill;

pattern detect(out GraphTerm $read, out GraphTerm $cache, out GraphTerm $key, out GraphTerm $presence, out GraphTerm $lookup, out GraphTerm $load, out GraphTerm $source, out GraphTerm $write, out GraphTerm $hit_return, out GraphTerm $miss_return) {
  type $unit {
    field $cache { }
    method $read {
      param $key { reassigned: false; }
      param $source { }
      body {
        let $hit = call $presence { receiver: $cache; name: ["contains", "containsKey", "has", "Contains", "ContainsKey"]; argument $key at 0; };
        if ($hit) {
          let $looked = call $lookup { receiver: $cache; name: ["get", "Get"]; argument $key at 0; };
          return $looked as $hit_return;
        }
        let $loaded = call $load { receiver: $source; name: ["load"]; argument $key at 0; };
        call $write { receiver: $cache; name: ["set", "put", "Set"]; argument $key at 0; argument $loaded at 1; };
        return $loaded as $miss_return;
      }
    }
  }
  where $source != $cache;
  where $lookup != $load;
  where $presence != $lookup;
  where $presence.explicit_arguments == 1;
  where $lookup.explicit_arguments == 1;
  where $write.explicit_arguments == 2;
}

query results {
  use detect(read: $read, cache: $cache, key: $key, presence: $presence, lookup: $lookup, load: $load, source: $source, write: $write, hit_return: $hit_return, miss_return: $miss_return);
  select $read, $cache, $key, $presence, $lookup, $load, $source, $write, $hit_return, $miss_return;
}
'''
