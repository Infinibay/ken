query_language = "kql/2"
id = "architecture.subclass-factory"
name = "Subclass Factory"
description = "A factory returns a locally defined class derived from its supplied base."
collections = ["architecture", "modern"]
tags = ["web", "mixin", "class-decorator", "dynamic-inheritance"]
caveat = "A returned subclass construction site, not proof of runtime base identity, decorator application, type compatibility, argument forwarding, MRO or GoF Decorator intent. Requires supported return flow and an explicitly unreassigned base parameter, or a concise arrow whose body is the class expression itself."
query = '''
language "kql/2";
module ken.catalog.architecture.subclass_factory;
import ken.catalog.architecture.subclass_factory.variants.returned_subclass;

pattern detect(out GraphTerm $factory, out GraphTerm $derived, out GraphTerm $base) {
  use ken.catalog.architecture.subclass_factory.variants.returned_subclass.detect(factory: $factory, derived: $derived, base: $base);
}

query results {
  use detect(factory: $factory, derived: $derived, base: $base);
  select $factory, $derived, $base;
}
'''

[[variants]]
id = "returned-subclass"
status = "ready"
languages = ["python", "javascript", "typescript"]
query_claim = "A returned local class derives from an unreassigned parameter, directly or through unique preceding top-level local aliases with a supported write inventory. Return flow or a direct concise-arrow body identifies the returned class; runtime substitution, hidden rebinding and heap identity remain unproven."
query = '''
language "kql/2";
module ken.catalog.architecture.subclass_factory.variants.returned_subclass;

pattern detect(out GraphTerm $factory, out GraphTerm $derived, out GraphTerm $base) {
  callable $factory {
    param $base { reassigned: false; }
    class $derived { base: $base; }
  }
  where returns_value($factory, $derived);
}

query results {
  use detect(factory: $factory, derived: $derived, base: $base);
  select $factory, $derived, $base;
}
'''
