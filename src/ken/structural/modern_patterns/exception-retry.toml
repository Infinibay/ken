id = "resilience.exception-retry"
name = "Exception Retry Loop"
description = "A protected call returns from a loop on success; an exception handler continues explicitly or falls through at the tail of that loop."
collections = ["modern", "resilience"]
tags = ["web", "retry", "exceptions"]
caveat = "Lexical retry candidate, not proof of reachable retries, stable target/arguments, transient errors, safe repetition, backoff, bounds or cancellation. Fallthrough excludes finally/resources/else and unsupported statement flow. The explicit-continue variant retains its lexical contract, where finally may override exits. Result/error protocols and library policies need other variants. A loop trying distinct providers may represent fallback instead of retry."
query = '''
query exception_retry {
 any {
  match "resilience.exception-retry#explicit-continue"(unit:$unit,loop:$loop,protected:$protected,handler:$handler,attempt:$attempt,retry:$retry);
 } or {
  match "resilience.exception-retry#handler-fallthrough"(unit:$unit,loop:$loop,protected:$protected,handler:$handler,attempt:$attempt,retry:$retry);
 }
 emit $unit, $loop, $protected, $handler, $attempt, $retry;
}
'''

[[variants]]
id = "explicit-continue"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp"]
query = '''
query explicit_continue {
 operation(native_kind: continue_statement) as $retry;
 require $retry IN_HANDLER $handler;
 require $handler HANDLER_OF $protected;
 require $protected ENCLOSING_LOOP $loop;
 require $retry CONTINUE_TARGET $loop;
 require $unit HAS_OPERATION $loop;
 callable() as $unit;
 operation(kind: return) as $success;
 require $success IN_TRY_BODY $protected;
 require $success ENCLOSING_LOOP $loop;
 operation(kind: call) as $attempt;
 path $attempt SYNTAX_PARENT{1,3} $success as $returned;
 emit $unit, $loop, $protected, $handler, $attempt, $retry;
}
'''

[[variants]]
id = "handler-fallthrough"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp"]
query = '''
query handler_fallthrough {
 require $handler HANDLER_FALLTHROUGH $protected;
 require $loop LOOP_BODY_TAIL $protected;
 require $unit HAS_OPERATION $loop;
 callable() as $unit;
 operation(kind: return) as $success;
 require $success IN_TRY_BODY $protected;
 require $success ENCLOSING_LOOP $loop;
 operation(kind: call) as $attempt;
 path $attempt SYNTAX_PARENT{1,3} $success as $returned;
 emit $unit, $loop, $protected, $handler, $attempt, retry=$handler;
}
'''
