query_language = "kql/2"
id = "resilience.exception-retry"
name = "Exception Retry Loop"
description = "A protected call returns from a loop on success; an exception handler continues explicitly or falls through at the tail of that loop."
collections = ["modern", "resilience"]
tags = ["web", "retry", "exceptions"]
caveat = "Lexical retry candidate, not proof of reachable retries, stable target/arguments, transient errors, safe repetition, backoff, bounds or cancellation. Fallthrough excludes finally/resources/else and unsupported statement flow. Explicit continue excludes finalizers with explicit exits/suspension and unsupported resource handling; implicit exceptions can still override completion. Result/error protocols and library policies need other variants. A loop trying distinct providers may represent fallback instead of retry."
query = '''
language "kql/2";
module ken.catalog.resilience.exception_retry;
import ken.catalog.resilience.exception_retry.variants.explicit_continue;
import ken.catalog.resilience.exception_retry.variants.handler_fallthrough;

pattern detect(out Callable $unit, out Operation $loop, out Operation $protected, out Operation $handler, out Operation $attempt, out Operation $retry) {
  either {
    use ken.catalog.resilience.exception_retry.variants.explicit_continue.detect(unit: $unit, loop: $loop, protected: $protected, handler: $handler, attempt: $attempt, retry: $retry);
  } or {
    use ken.catalog.resilience.exception_retry.variants.handler_fallthrough.detect(unit: $unit, loop: $loop, protected: $protected, handler: $handler, attempt: $attempt, retry: $retry);
  }
}

query results {
  use detect(unit: $unit, loop: $loop, protected: $protected, handler: $handler, attempt: $attempt, retry: $retry);
  select $unit, $loop, $protected, $handler, $attempt, $retry;
}
'''

[[variants]]
id = "explicit-continue"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp"]
query = '''
language "kql/2";
module ken.catalog.resilience.exception_retry.variants.explicit_continue;

pattern detect(out Callable $unit, out Operation $loop, out Operation $protected, out Operation $handler, out Operation $attempt, out Operation $retry) {
  callable $unit { }
  operation $loop { kind: "loop"; }
  operation $protected { kind: "try"; }
  operation $handler { }
  operation $retry { native_kind: "continue_statement"; }
  operation $success { kind: "return"; }
  operation $attempt { kind: "call"; }
  where runs($unit, $loop);
  where inside_try($success, $protected);
  where inside_try($attempt, $protected);
  where enclosed_by($success, $loop);
  where enclosed_by($protected, $loop);
  where enclosed_by($retry, $loop);
  where handles($handler, $protected);
  where inside_handler($retry, $handler);
  where continues_to($retry, $loop);
  where exits_cleanly($protected);
  where returns_operand($success, $attempt);
}

query results {
  use detect(unit: $unit, loop: $loop, protected: $protected, handler: $handler, attempt: $attempt, retry: $retry);
  select $unit, $loop, $protected, $handler, $attempt, $retry;
}
'''

