query = '''
language "kql/2";
module ken.catalog.resilience.exception_retry.variants.handler_fallthrough;

pattern detect(out Callable $unit, out Operation $loop, out Operation $protected, out Operation $handler, out Operation $attempt, out Operation $retry) {
  callable $unit { }
  operation $loop { kind: "loop"; }
  operation $protected { kind: "try"; }
  operation $handler { }
  operation $success { kind: "return"; }
  operation $attempt { kind: "call"; }
  where runs($unit, $loop);
  where inside_try($success, $protected);
  where inside_try($attempt, $protected);
  where enclosed_by($success, $loop);
  where enclosed_by($protected, $loop);
  where handles($handler, $protected);
  where ends_with($loop, $protected);
  where falls_through($handler, $protected);
  where returns_operand($success, $attempt);
  bind $retry = $handler;
}

query results {
  use detect(unit: $unit, loop: $loop, protected: $protected, handler: $handler, attempt: $attempt, retry: $retry);
  select $unit, $loop, $protected, $handler, $attempt, $retry;
}
'''
