schema = "ken-rule/1"
id = "chain-of-responsibility"
name = "Chain of Responsibility"
category = "behavioral"
description = "A handler conditionally forwards to another handler, as a linked object or as a closure."
caveat = "The same shape can be a Proxy; request handling and chain topology require review. The selected forwarding call occurs inside a lexical branch arm, or on the continuation of a guard whose other outcome returns immediately. Request/result preservation and exclusive handling are not proven. The closure variant proves the forwarding is branch-guarded, not that a terminating path exists."
legacy_query = "require $unit SUBTYPE_OF $handler\nrequire $unit HAS_FIELD $next\nrequire $next TYPE $handler\nrequire $unit HAS_METHOD $handle\nrequire $handle CONDITIONAL_DELEGATION $next\n"
query = '''
language "kql/2";
module ken.catalog.chain_of_responsibility;
import ken.catalog.chain_of_responsibility.variants.linked_handlers;
import ken.catalog.chain_of_responsibility.variants.middleware_closures;

pattern detect(out GraphTerm $unit) {
  either {
    use ken.catalog.chain_of_responsibility.variants.linked_handlers.detect(unit: $unit);
  } or {
    use ken.catalog.chain_of_responsibility.variants.middleware_closures.detect(unit: $unit);
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
query_language = "kql/2"
claim = "structural-signature"

[[variants]]
id = "linked-handlers"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["request_value_flow", "conditional_calls"]
graph_requirements = ["Handler procesa o reenvía misma request a siguiente del contrato; ensamblado de cadena aporta evidencia."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
language "kql/2";
module ken.catalog.chain_of_responsibility.variants.linked_handlers;

pattern detect(out TypeDecl $unit) {
  type $contract { method $slot { } }
  type $unit {
    field $next { type: nominal($contract); }
    method $handle {
      call $forward { }
      either {
        body { if (_) { call $forward { receiver: $next; }; } }
      } or {
        body { if (_) { return _; } call $forward { receiver: $next; }; }
      }
    }
  }
  where subtype($unit, $contract);
  where overrides($handle, $slot);
  where $handle.name == $forward.name;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
[[variants]]
id = "middleware-closures"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["closure_capture", "control_flow"]
graph_requirements = ["Handler captura next; rama puede terminar o continuar request; distinguir pipeline incondicional."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un callable fabrica un handler que captura un parametro callable `next`, y la delegacion esta guardada por una rama: el resultado del delegado es el valor que devuelve UNO de los dos desenlaces de la rama (o su expresion de cola, en un lenguaje de expresiones), el otro desenlace termina sin delegar, y el delegado se invoca con la request del propio handler. Se aceptan las dos formas de invocacion del delegado, callee directo (`next(request)`) y llamada sobre el parametro (`next.apply(request)`). Un wrapper incondicional queda excluido: sin rama, y sin un desenlace que devuelva el resultado del delegado, no hay eslabon, solo un wrapper. El corpus adversarial que delega en AMBOS desenlaces lo hace con argumentos constantes, de modo que el filtro del argumento tambien lo excluye. No prueba manejo exclusivo, preservacion de la request ni topologia de la cadena."
query = '''
language "kql/2";
module ken.catalog.chain_of_responsibility.variants.middleware_closures;

pattern detect(out Callable $unit, out Callable $factory, out Parameter $next, out Call $delegate) {
  callable $factory { parameters { param $next {} } }
  callable $unit { constructor: false; captures: $next; parameters { param $request {} } }
  callable $factory { body { return $unit; } }
  where $factory != $unit;
  either {
    callable $unit { body {
      if (_) { return _; }
      let $delegated = call $next { argument $request at any; } as $delegate;
      return $delegated;
    } }
  } or {
    callable $unit { body {
      if (_) { return _; }
      let $delegated = call $delegate { receiver: $next; argument $request at any; };
      return $delegated;
    } }
  }
}

query results {
  use detect(unit: $unit, factory: $factory, next: $next, delegate: $delegate);
  select $unit, $factory, $next, $delegate;
}
'''

[[operations]]
id = "single_exclusive_handler"
status = "ready"
description = "A linked handler returns the same request delegation or its one local processing call. Bounded single-dispatch source contract."
caveat = "Explicit source contract; no proof of hidden effects, feasible paths or runtime dispatch."
query = '''
language "kql/2";
module ken.catalog.chain_of_responsibility.single_exclusive_handler;

pattern detect(out TypeDecl $unit, out Callable $handle, out Callable $processing, out Call $forward, out Call $local, out Parameter $request) {
  type $contract { method $slot { } }
  type $unit {
    field $next { type: nominal($contract); }
    method $processing { constructor: false; }
    method $handle {
      constructor: false;
      param $request { }
      receiver $self { }
      either {
        body { if (_) { call $forward { receiver: $next; }; } }
      } or {
        body { if (_) { return _; } call $forward { receiver: $next; }; }
      }
      body {
        let $forwarded = call $forward { receiver: $next; argument $request at any; };
        return $forwarded;
      }
      call $local { receiver: $self; target: $processing; }
      body {
        let $locally_handled = call $local { receiver: $self; argument $request at any; };
        return $locally_handled;
      }
    }
  }
  where subtype($unit, $contract);
  where overrides($handle, $slot);
  where $handle.name == $forward.name;
  where $processing != $handle;
  where $forward != $local;
  require one dispatch of $handle named $forward;
  require one dispatch of $handle named $local;
}

query results {
  use detect(unit: $unit, handle: $handle, processing: $processing, forward: $forward, local: $local, request: $request);
  select $unit, $handle, $processing, $forward, $local, $request;
}
'''
