schema = "ken-rule/1"
id = "chain-of-responsibility"
name = "Chain of Responsibility"
category = "behavioral"
description = "A handler conditionally forwards to another handler, as a linked object or as a closure."
caveat = "The same shape can be a Proxy; request handling and chain topology require review. The selected forwarding call must occur inside a lexical branch arm; early exits, request/result preservation and exclusive handling are not proven. The closure variant proves the forwarding is branch-guarded, not that a terminating path exists."
legacy_query = "require $unit SUBTYPE_OF $handler\nrequire $unit HAS_FIELD $next\nrequire $next TYPE $handler\nrequire $unit HAS_METHOD $handle\nrequire $handle CONDITIONAL_DELEGATION $next\n"
query = '''
query chain_of_responsibility {
 any { match "chain-of-responsibility#linked-handlers"(unit: $unit); }
 or { match "chain-of-responsibility#middleware-closures"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "linked-handlers"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["request_value_flow", "conditional_calls"]
graph_requirements = ["Handler procesa o reenvía misma request a siguiente del contrato; ensamblado de cadena aporta evidencia."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query chain_of_responsibility {

 require $unit SUBTYPE_OF $contract;
 require $unit HAS_FIELD $next;
 require $next TYPE $contract;
 require $unit HAS_METHOD $handle;
 require $handle OVERRIDES $slot;
 require $handle CONDITIONAL_DELEGATION $next;
 require $handle HAS_CALL $forward;
 require $forward RECEIVER $next;
 require $forward SYNTAX_NODE $forward_syntax;
 path $forward_syntax SYNTAX_PARENT{0,32} $arm as $decision_scope;
 operation(role: [consequence, alternative]) as $arm;
 require $arm SYNTAX_PARENT $decision;
 operation(kind: branch) as $decision;
 call() as $forward;
 callable() as $handle;
 where $handle.name == $forward.name;
 emit $unit;
}
'''
[[variants]]
id = "middleware-closures"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["closure_capture", "control_flow"]
graph_requirements = ["Handler captura next; rama puede terminar o continuar request; distinguir pipeline incondicional."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un callable fabrica un handler que captura un parametro callable `next`, y la delegacion esta guardada por una rama: el resultado del delegado es el valor que devuelve UNO de los dos desenlaces de la rama (o su expresion de cola, en un lenguaje de expresiones) y el otro desenlace devuelve un valor distinto. El callable no invoca nada con el mismo nombre de callee mas de una vez, de modo que un pipeline que delegue en AMBOS desenlaces queda excluido: sin rama y sin un unico punto de delegacion no hay eslabon, solo un wrapper. El conteo se apoya en `complete:<callable>:HAS_CALL` (IR 1.61) y filtra por el nombre del delegado, no por resolucion, porque la resolucion no es completa. No prueba manejo exclusivo, preservacion de la request ni topologia de la cadena."
query = '''
query middleware_closures {
 require $factory HAS_PARAMETER $next;
 parameter(receiver: false) as $next;
 require $factory RETURNS $wrapped;
 callable(constructor: false) as $wrapped;
 require $wrapped CAPTURES $next;
 require $wrapped HAS_OPERATION $branch;
 operation(kind: branch) as $branch;
 require $branch CFG_NEXT $continuing;
 require $branch CFG_NEXT $terminal;
 different $continuing $terminal;
 path $continuing CFG_NEXT{0,4} $arm_return as $arm_body;
 any { require $arm_return RETURN_OPERAND $delegate; }
 or { require $delegate SYNTAX_NODE $arm_return; }
 any { require $delegate CALLEE_VALUE $next; } or { require $delegate RECEIVER $next; }
 path $terminal CFG_NEXT{0,4} $terminal_return as $terminal_body;
 operation(kind: return) as $terminal_return;
 require $terminal_return RETURN_OPERAND $terminated;
 different $terminated $delegate;
 count distinct $call = 1 {
  require $wrapped HAS_CALL $call;
  where $call.name == $delegate.name;
 };
 emit unit=$wrapped, $factory, $next, $branch, $delegate, $terminal_return;
}
'''
