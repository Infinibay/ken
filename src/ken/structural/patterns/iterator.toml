schema = "ken-rule/1"
id = "iterator"
name = "Iterator"
category = "behavioral"
description = "A class supplies paired traversal protocol methods, or a callable advances a source asynchronously."
caveat = "Protocol names are intentional API evidence; exhaustion and traversal correctness are not proven. The async variant records that a loop suspends to advance, not that the awaited work ever completes."
legacy_query = "require $unit IS CLASS\nvariant python\nrequire $unit HAS_METHOD $iter name=__iter__\nrequire $unit HAS_METHOD $next name=__next__\nend\nvariant has-next\nrequire $unit HAS_METHOD $next name=next|Next\nrequire $unit HAS_METHOD $has_next name=hasNext|HasNext|MoveNext\nend\nvariant generator\nrequire $unit HAS_METHOD $iter\nrequire $iter HAS_YIELD _\nend\n"
query = '''
query iterator {
 any { match "iterator#external-cursor"(iterator: $iterator); } or {
 any { match "iterator#generator"(iterator: $iterator); } or { match "iterator#delegated-generator"(iterator: $iterator); } or { match "iterator#explicit-cursor"(iterator: $iterator); } or { match "iterator#paired-cursor"(iterator: $iterator); } or { match "iterator#delegated-cursor"(iterator: $iterator); } or { match "iterator#async-iterator"(iterator: $iterator); }
 }
 emit $iterator;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[operations]]
id = "iterate_over"
status = "ready"
description = "Expose a foreach source, value binding, body and iteration occurrence."
caveat = "Syntax-level consumption shape. Not a guarantee of execution, element types, absence of rebinding or full block-scope shadow resolution. Explicit cursor and callback pipelines require additional variants."
query = '''
query iterate_over {
 require $iteration ITERATION_SOURCE $source;
 require $iteration ITERATION_BINDING $item [role: value];
 require $iteration ITERATION_BODY $body;
 emit $source, $item, $body, $iteration;
}
'''

[[variants]]
id = "external-cursor"
status = "ready"
languages = ["cpp"]
fixtures_status = "source-regression-matrix"
query_claim = "External cursor API with shared stored position; termination and overloaded increment semantics are not proven."
query = '''
query external_cursor {
 type_decl(language: cpp) as $iterator;
 require $iterator HAS_FIELD $position;
 require $iterator HAS_METHOD $advance;
 callable(name: "next") as $advance;
 require $advance READS $position;
 require $advance WRITES $position;
 require $iterator HAS_METHOD $test;
 callable(name: "isDone") as $test;
 require $test READS $position;
 require $iterator HAS_METHOD $current;
 callable(name: "currentItem") as $current;
 require $current READS $position;
 emit $iterator;
}
'''

[[variants]]
id = "generator"
status = "ready"
languages = ["python", "javascript", "typescript", "csharp"]
requires = ["generator_lowering"]
graph_requirements = ["Callable suspende produciendo elementos; la evidencia prueba forma generadora, no recorrido correcto."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"
query_draft = "query generator_shape {\n  callable(generator: true, context_manager: false) as $iterator;\n  operation(kind: yield) as $suspend;\n  require $iterator HAS_OPERATION $suspend;\n  emit $iterator;\n}\n"
query_claim = "Presencia de forma generadora; no prueba progreso ni agotamiento."

query = '''
query generator {
  callable(generator: true, context_manager: false) as $iterator;
  operation(kind: yield) as $suspend;
  require $iterator HAS_OPERATION $suspend;
  emit $iterator;
}
'''

[[variants]]
id = "delegated-generator"
status = "ready"
languages = ["python", "javascript", "typescript"]
requires = ["generator_delegation"]
graph_requirements = ["Delegación de iteración enlaza iterable delegado y suspensión; conservar protocolo nativo."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"

query = '''
query delegated_generator {
  callable(generator: true, context_manager: false) as $iterator;
  operation(kind: yield_delegate) as $suspend;
  require $iterator HAS_OPERATION $suspend;
  emit $iterator;
}
'''

[[variants]]
id = "explicit-cursor"
status = "ready"
languages = ["python"]
pending_languages = ["javascript", "typescript", "java", "csharp", "cpp", "rust"]
requires = ["iteration_protocol", "storage_flow"]
graph_requirements = ["Contrato de iteración, progreso y fin; protocolo resuelto, no solo métodos homónimos."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"

query = '''
query python_cursor {
 type_decl(language: python) as $iterator;
 require $iterator HAS_METHOD $iter;
 callable(name: "__iter__") as $iter;
 require $iter RETURNS_SELF $iterator;
 require $iterator HAS_METHOD $next;
 callable(name: "__next__") as $next;
 require $iterator HAS_FIELD $state;
 require $next HAS_OPERATION $write;
 require $write ASSIGNMENT_TARGET $state;
 require $next READS $state;
 emit $iterator;
}
'''
query_claim = "Python iteration protocol with observable updates to an iterator field; local bookkeeping is not cursor state. Numeric progress, yielded element provenance and exhaustion are not proven."

[[variants]]
id = "callback-iterator"
status = "design"
languages = ["go"]
requires = ["range_function_protocol", "callback_control_flow"]
graph_requirements = ["Callback recibe elemento y su booleano gobierna continuar; requiere versión de lenguaje aplicable."]
missing_capability = "unknown"
fixtures_status = "documented-not-validated"

[[variants]]
id = "async-iterator"
status = "ready"
languages = ["python", "javascript", "typescript", "csharp"]
requires = ["async_iteration_protocol", "generator_lowering"]
graph_requirements = ["Producción/avance y consumo se rigen por protocolo async; await no se transforma en thread."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-four-languages"
query_claim = "Un callable async recorre con un bucle que suspende (`async for`, `for await`, `await foreach`) la fuente producida por otro callable async que suspende al avanzar (`yield` mas `await`). El bucle asincrono se registra en el propio bucle: los hechos de iteracion son identicos a los de un bucle sincrono sobre la misma fuente. No prueba agotamiento, tipos de elemento, ni que lo awaitado termine; un generador async que nunca awaits queda excluido, porque entonces la produccion no esta gobernada por el protocolo async."
query = '''
query async_iterator {
 require $consumer IS CALLABLE;
 callable(async: true) as $consumer;
 require $consumer HAS_OPERATION $loop;
 operation(kind: loop, async: true) as $loop;
 require $loop ITERATION_SOURCE $source;
 require $source TARGET $producer;
 require $producer IS CALLABLE;
 callable(async: true) as $producer;
 require $producer HAS_OPERATION $suspend;
 operation(kind: yield) as $suspend;
 require $producer HAS_OPERATION $awaited;
 operation(kind: await) as $awaited;
 different $consumer $producer;
 emit iterator=$consumer, $producer, $loop, $source, $suspend, $awaited;
}
'''

[[variants]]
id = "paired-cursor"
status = "ready"
languages = ["java", "typescript"]
fixtures_status = "source-regression-matrix"
query_claim = "Paired next/hasNext API and an observable cursor update; termination is not proven."
query = '''
query paired_cursor {
 require $iterator HAS_METHOD $next;
 callable(name: "next") as $next;
 require $iterator HAS_METHOD $test;
 callable(name: "hasNext") as $test;
 require $next WRITES $state;
 require $next READS $state;
 require $test READS $state;
 emit $iterator;
}
'''

[[variants]]
id = "delegated-cursor"
status = "ready"
languages = ["python"]
fixtures_status = "source-regression-matrix"
query_claim = "Python next() delegation on stored iterator with self-returning iterable protocol."
query = '''
query delegated_cursor {
 require $iterator HAS_METHOD $iter;
 callable(name: "__iter__") as $iter;
 require $iter RETURNS_SELF $iterator;
 require $iterator HAS_METHOD $next;
 callable(name: "__next__") as $next;
 require $next RETURNS_CALL $advance;
 require $advance ADVANCES_ITERATOR $cursor;
 require $iterator HAS_FIELD $cursor;
 emit $iterator;
}
'''
