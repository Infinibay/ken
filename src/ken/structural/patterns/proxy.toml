schema = "ken-rule/1"
id = "proxy"
name = "Proxy"
category = "structural"
description = "A same-contract wrapper conditionally forwards operations."
caveat = "Conditional same-contract delegation overlaps with guarded decorators."
legacy_query = "require $unit SUBTYPE_OF $contract\nrequire $unit HAS_FIELD $subject\nrequire $subject TYPE $contract\nrequire $unit HAS_METHOD $method\nrequire $method CONDITIONAL_DELEGATION $subject\n"
query = '''
query proxy {
 any { match "proxy#guarded-access"(unit: $unit); }
 or { match "proxy#lazy-subject"(unit: $unit); }
 or { match "proxy#remote-subject"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "guarded-access"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["control_flow", "api_effects", "contract_resolution"]
graph_requirements = ["Política puede impedir acceso al subject del mismo contrato; rechazo puede ser excepción o resultado."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query proxy {

 require $unit SUBTYPE_OF $contract;
 require $unit HAS_FIELD $subject;
 require $subject TYPE $contract;
 require $unit HAS_METHOD $method;
 require $method OVERRIDES $slot;
 require $method CONDITIONAL_DELEGATION $subject;
 require $method HAS_CALL $forward;
 require $forward RECEIVER $subject;
 require $forward SYNTAX_NODE $forward_syntax;
 path $forward_syntax SYNTAX_PARENT{0,32} $arm as $guard_scope;
 operation(role: [consequence, alternative]) as $arm;
 require $arm SYNTAX_PARENT $guard;
 operation(kind: branch) as $guard;
 call() as $forward;
 callable() as $method;
 where $method.name == $forward.name;
 emit $unit;
}
'''
[[variants]]
id = "lazy-subject"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["guarded_allocation", "receiver_identity"]
graph_requirements = ["Carga diferida de subject y delegacion posterior usan el mismo almacenamiento."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un metodo escribe un campo bajo una guarda que referencia ese mismo campo, contiene una construccion de OTRO tipo, y delega sobre el mismo campo: carga diferida del subject y delegacion posterior sobre ese almacenamiento. No exige una forma concreta del test de ausencia (comparacion nula, `is_none()` o `== None`), solo que la escritura este guardada por el propio campo, ni prueba que la construccion sea alcanzable en ejecucion ni la identidad runtime del receptor."
query = '''
query proxy {
 require $unit HAS_FIELD $subject;
 require $unit HAS_METHOD $access;
 callable(constructor: false) as $access;
 require $subject GUARDS_WRITE $access;
 require $access HAS_CALL $creation;
 require $creation ALLOCATES_TYPE $created;
 different $created $unit;
 require $access DELEGATES_TO $subject;
 emit $unit, $subject, $access, $creation, $created;
}
'''

[[variants]]
id = "remote-subject"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["rpc_models", "contract_resolution"]
graph_requirements = ["Contrato local representa operación remota y mapea argumentos/resultados; modelo RPC identificado."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "La **implementacion local visible** que serializa la llamada y devuelve su respuesta: la clase implementa el contrato local (`SUBTYPE_OF`, o `IMPLEMENTS` en Go, que satisface la interfaz por method set), guarda un cliente cuyo tipo **no** es ese contrato, su metodo delega en el cliente pasando como argumento el resultado de un **codificador** alimentado por su propio parametro, y devuelve el resultado de un **decodificador** distinto de la llamada de transporte. El tipo del cliente se alcanza por declaracion (anotaciones o campos) o por la **construccion** con la que se inicializa el campo, que es lo que tiene JavaScript en vez de declaracion. NO prueba que el transporte sea realmente remoto, ni que el codec serialice de verdad, ni que el cliente no se reasigne, ni que la respuesta se consuma entera, ni que ningun camino de excepcion salte el decodificado. La otra alternativa de la ficha (una tabla de nombres de API RPC) no se implementa."
query = '''
query proxy_remote_subject {
 require $unit HAS_FIELD $client;
 require $client TYPE $client_type;
 require $unit HAS_METHOD $method;
 require $method OVERRIDES $slot;
 any { require $unit SUBTYPE_OF $contract; }
 or { require $unit IMPLEMENTS $contract; }
 different $client_type $contract;
 require $method HAS_CALL $transport;
 require $transport RECEIVER $client;
 require $method HAS_PARAMETER $request;
 parameter(receiver: false) as $request;
 require $transport ARGUMENT $argument;
 require $argument VALUE $encoded;
 require $encoder RESULT $encoded;
 call() as $encoder;
 require $encoder ARGUMENT $encoder_argument;
 require $encoder_argument VALUE $encoder_input;
 require $encoder_input LOADED_FROM $request;
 require $method RETURNS_CALL $decoder;
 different $transport $decoder;
 emit unit=$unit, $contract, $client, $method, $transport, $encoder, $decoder, $request;
}
'''
