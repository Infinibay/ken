schema = "ken-rule/1"
id = "bridge"
name = "Bridge"
category = "structural"
description = "An abstraction hierarchy holds a separate implementation hierarchy, at run time or through a type parameter."
caveat = "Structural evidence requires review of intent and runtime behavior. The generic variant reads a field typed by a shared type parameter, so it proves the implementation is chosen at compile time and that the parameter is not tied to one abstraction; it does not require virtual dispatch, nor prove which instantiation a use site chose."
legacy_query = "require $unit SUBTYPE_OF $abstraction\nrequire $abstraction HAS_FIELD $field\nrequire $field TYPE $implementation\ncount >=2 $concrete SUBTYPE_OF $implementation distinct=$concrete\ndifferent $abstraction $implementation\n"
query = '''
query bridge {
 any { match "bridge#runtime-composition"(unit: $unit); }
 or { match "bridge#refined-composition"(unit: $unit); }
 or { match "bridge#generic-composition"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "runtime-composition"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["contract_resolution", "receiver_identity"]
graph_requirements = ["Dos dimensiones de variantes; una abstracción delega en implementación suministrada."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query bridge {

 require $unit SUBTYPE_OF $abstraction;
 require $abstraction HAS_FIELD $field;
 require $field TYPE $implementation;
 any {
  where $unit.language != "cpp";
 } or {
  where $unit.language == "cpp";
  require $abstraction NOMINAL_ROOT $abstraction_root;
  require $implementation NOMINAL_ROOT $implementation_root;
  different $abstraction_root $implementation_root;
 }
 require $abstraction HAS_METHOD $operation;
 require $operation DELEGATES_TO $field;
 require $first SUBTYPE_OF $implementation;
 require $second SUBTYPE_OF $implementation;
 different $first $second;
 different $abstraction $implementation;
 emit $unit;
}
'''
[[variants]]
id = "generic-composition"
status = "ready"
languages = ["typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["generic_substitution", "contract_resolution"]
graph_requirements = ["Parámetro de tipo de implementación independiente de variantes de abstracción; no exigir virtual dispatch."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-six-languages"
query_claim = "Un tipo liga un parametro de tipo, un campo suyo esta tipado por ESE parametro y un metodo no constructor delega en el campo por receptor; ademas **al menos dos tipos** ligan el mismo nombre de parametro, que es lo que expresa que el parametro de implementacion no este atado a una sola abstraccion. No exige despacho virtual ni contrato: no se pide subtipo, ni interfaz, ni implementaciones multiples, que es lo que separa esta variante de `runtime-composition`, y la comparte con `strategy#static-policy` salvo por el conteo —una sola declaracion ligando el parametro matchea aquella y no esta—. El conteo es una cota inferior sobre TIPOS (`type_decl()`), no sobre toda entidad que ligue el parametro: el constructor y el metodo de una clase generica tambien lo ligan, y contarlos haria que una sola clase satisfaciera el `>= 2`. No prueba sustitucion de tipos ni que la instanciacion del sitio de uso sea la elegida."
query = '''
query generic_composition {
 require $abstraction BINDS_TYPE_PARAMETER $implementation_parameter;
 require $abstraction HAS_FIELD $implementation;
 require $implementation TYPE_NAME $implementation_parameter;
 require $abstraction HAS_METHOD $operation;
 callable(constructor: false) as $operation;
 require $operation HAS_CALL $call;
 require $call RECEIVER $implementation;
 count distinct $variant >= 2 {
  require $variant BINDS_TYPE_PARAMETER $implementation_parameter;
  type_decl() as $variant;
 };
 emit unit=$abstraction, $implementation, $implementation_parameter, $operation;
}
'''

[[variants]]
id = "refined-composition"
status = "ready"
languages = ["python", "typescript", "java", "csharp"]
requires = ["override_resolution", "receiver_identity", "contract_resolution"]
graph_requirements = ["A refined abstraction overrides a base slot and delegates through a locally typed field or an inherited instance slot to a distinct implementation contract with two nominal variants."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"
query_claim = "Two nominal variation dimensions with a delegated implementation field. Does not prove constructor injection, current field value, feasible combinations, independent evolution or runtime contracts. Inherited instance slots retain the Python/JS/TS single-inheritance model and its exclusions; Lombok and other generators are not expanded."
query = '''
query refined_bridge {
 require $unit SUBTYPE_OF $abstraction;
 require $unit HAS_METHOD $operation;
 require $operation OVERRIDES $slot;
 require $abstraction HAS_METHOD $slot;
 require $operation DELEGATES_TO $access;
 require $unit HAS_FIELD $access;
 path $access INSTANCE_SLOT{0,1} $field as $member_slot;
 require $field TYPE $implementation;
 variable(static:false) as $field;
 require $abstraction NOMINAL_ROOT $abstraction_root;
 require $implementation NOMINAL_ROOT $implementation_root;
 different $abstraction_root $implementation_root;
 require $first SUBTYPE_OF $implementation;
 require $second SUBTYPE_OF $implementation;
 different $first $second;
 different $abstraction $implementation;
 different $unit $implementation;
 require $peer SUBTYPE_OF $abstraction;
 different $unit $peer;
 emit $unit,$peer,$abstraction,$operation,$slot,$access,$field,$implementation,$first,$second;
}
'''

[[operations]]
id = "returned_primitive"
status = "ready"
description = "A refined abstraction returns the origin of an invocation on its implementation field."
caveat = "Requires supported return-origin analysis; does not prove injection, hidden effects or runtime receiver identity."
query = '''
query bridge_returned_primitive {
 match "bridge#refined-composition"(unit:$unit,operation:$operation,access:$access);
 require $operation HAS_OPERATION $return;
 require $return RETURN_ORIGIN $call;
 require $call RECEIVER $access;
 emit $unit,$operation,$call;
}
'''
