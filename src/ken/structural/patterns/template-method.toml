schema = "ken-rule/1"
id = "template-method"
name = "Template Method"
category = "behavioral"
description = "A base algorithm calls a step overridden by a subtype."
caveat = "Structural evidence requires review of intent and runtime behavior."
query = '''
language "kql/2";
module ken.catalog.template_method;
import ken.catalog.template_method.variants.composed_skeleton;
import ken.catalog.template_method.variants.trait_default;
import ken.catalog.template_method.variants.virtual_skeleton;

pattern detect(out Entity $unit) {
  either {
    use ken.catalog.template_method.variants.virtual_skeleton.detect(unit: $unit);
  } or {
    use ken.catalog.template_method.variants.trait_default.detect(unit: $unit);
  } or {
    use ken.catalog.template_method.variants.composed_skeleton.detect(unit: $unit);
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
query_language = "kql/2"
claim = "structural-signature"

[[variants]]
id = "virtual-skeleton"
status = "ready"
languages = ["python", "java", "typescript", "cpp"]
requires = ["override_resolution", "control_flow"]
graph_requirements = ["Algoritmo fija secuencia y llama hook reemplazado; distinguir llamadas del mismo cuerpo."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
language "kql/2";
module ken.catalog.template_method.variants.virtual_skeleton;
import ken.core;

pattern detect(out TypeDecl $unit) {
  class $unit {
    method $step { constructor: false; }
    method $template {
      constructor: false;
      receiver $self {}
      body {
        call $step { receiver: $self; dispatch: possible; };
      }
    }
  }
  method $override { constructor: false; }
  where overrides($override, $step);
  where $template != $step;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
[[variants]]
id = "trait-default"
status = "ready"
languages = ["rust"]
requires = ["trait_defaults", "call_targets", "trait_impl_linkage"]
graph_requirements = ["Método default llama slot de trait implementado por tipo concreto."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-rust"
query_claim = "Un método default de trait invoca un hook del mismo trait sobre su propio receptor. Existe al menos una implementación que sobrescribe el hook. No impone dos implementaciones concretas en el proyecto ni prueba despacho runtime."
query = '''
language "kql/2";
module ken.catalog.template_method.variants.trait_default;
import ken.core;

pattern detect(out TypeDecl $unit, out Callable $algorithm, out Callable $hook) {
  trait $unit {
    method $hook {}
    method $algorithm {
      receiver $self {}
      body { call $hook { receiver: $self; dispatch: possible; }; }
    }
  }
  type $concrete { method $implementation {} }
  where subtype($concrete, $unit);
  where overrides($implementation, $hook);
  where $algorithm != $hook;
}

query results {
  use detect(unit: $unit, algorithm: $algorithm, hook: $hook);
  select $unit, $algorithm, $hook;
}
'''

[[variants]]
id = "composed-skeleton"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["callable_contracts", "argument_result_flow"]
graph_requirements = ["Esqueleto recibe hooks y conserva secuencia; variante por composicion, no override ficticio."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un esqueleto recibe tres hooks distintos y encadena sus resultados en una misma ruta: prepare produce la entrada de transform y transform la de finish. Admite callables directos y métodos de interfaces funcionales con destino acreditado. Permite ruido intermedio, rechaza resultados reemplazados. Formas mixtas de callable y objeto en un mismo esqueleto siguen pendientes de composición local en BODY."
query = '''
language "kql/2";
module ken.catalog.template_method.variants.composed_skeleton;
import ken.core;

pattern detect(out Callable $unit, out Parameter $prepare, out Parameter $transform, out Parameter $finish) {
  callable $unit {
    parameters {
      param $prepare {}
      param $transform {}
      param $finish {}
    }
  }
  either {
    callable $unit {
      body {
        let $prepared = call $prepare {};
        let $transformed = call $transform { argument $prepared at 0; };
        call $finish { argument $transformed at 0; };
      }
    }
  } or {
    callable $unit {
      body {
        let $prepared = call $prepare_operation { receiver: $prepare; dispatch: possible; };
        let $transformed = call $transform_operation { receiver: $transform; dispatch: possible; argument $prepared at 0; };
        call $finish_operation { receiver: $finish; dispatch: possible; argument $transformed at 0; };
      }
    }
  }
  where $prepare != $transform and $transform != $finish and $prepare != $finish;
}

query results {
  use detect(unit: $unit, prepare: $prepare, transform: $transform, finish: $finish);
  select $unit, $prepare, $transform, $finish;
}
'''

[[operations]]
id = "dependent_steps"
status = "ready"
description = "Two distinct extension slots are invoked on the same modeled instance, passing the first result to the second."
caveat = "Dos pasos distintos del mismo receptor, en una misma ruta, con origen del argumento acreditado desde el primer resultado. Admite aliases locales y ruido; no prueba despacho runtime ni efectos de heap."
query = '''
language "kql/2";
module ken.catalog.template_method.dependent_steps;
import ken.core;

pattern detect(out TypeDecl $unit, out Callable $template, out Operation $first, out Operation $second) {
  class $unit {
    method $first_step {}
    method $second_step {}
    method $template {
      receiver $self {}
      body {
        let $value = call $first_step { receiver: $self; dispatch: possible; } as $first;
        call $second_step { receiver: $self; dispatch: possible; argument $value at 0; } as $second;
      }
    }
  }
  method $override {}
  where overrides($override, $first_step);
  where $first_step != $second_step;
  where $template != $first_step and $template != $second_step;
}

query results {
  use detect(unit: $unit, template: $template, first: $first, second: $second);
  select $unit, $template, $first, $second;
}
'''
