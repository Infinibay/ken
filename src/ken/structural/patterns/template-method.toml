schema = "ken-rule/1"
id = "template-method"
name = "Template Method"
category = "behavioral"
description = "A base algorithm calls a step overridden by a subtype."
caveat = "Structural evidence requires review of intent and runtime behavior."
legacy_query = "require $unit HAS_METHOD $template\nrequire $template CALLS $step\nrequire $unit HAS_METHOD $step\nrequire $override OVERRIDES $step\ndifferent $template $step\n"
query = '''
query template_method {
 any { match "template-method#virtual-skeleton"(unit: $unit); }
 or { match "template-method#trait-default"(unit: $unit); }
 or { match "template-method#composed-skeleton"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "virtual-skeleton"
status = "ready"
languages = ["python", "java", "typescript", "cpp"]
requires = ["override_resolution", "control_flow"]
graph_requirements = ["Algoritmo fija secuencia y llama hook reemplazado; distinguir llamadas del mismo cuerpo."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query template_method {

 require $unit HAS_METHOD $template;
 require $template CALLS $step;
 require $unit HAS_METHOD $step;
 require $override OVERRIDES $step;
 different $template $step;
 emit $unit;
}
'''
[[variants]]
id = "trait-default"
status = "ready"
languages = ["rust"]
requires = ["trait_defaults", "call_targets", "trait_impl_linkage"]
graph_requirements = ["Método default llama slot de trait implementado por tipo concreto."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-rust"
query_claim = "Un método default de un trait llama al menos un slot declarado por el mismo trait, y ese slot está implementado por al menos dos tipos concretos que implementan el trait. No prueba instanciación, dispatch dinámico en ejecución ni el orden real de las llamadas."
query = '''
query template_method {
 require $unit HAS_METHOD $algorithm;
 require $algorithm HAS_CALL $hook_call;
 require $hook_call TARGET $hook;
 require $unit HAS_METHOD $hook;
 different $algorithm $hook;
 count distinct $concrete >= 2 {
   require $implementation OVERRIDES $hook;
   require $implementation IN_TYPE $concrete;
   require $concrete SUBTYPE_OF $unit;
 };
 emit $unit, $algorithm, $hook;
}
'''

[[variants]]
id = "composed-skeleton"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["callable_contracts", "argument_result_flow"]
graph_requirements = ["Esqueleto recibe hooks y conserva secuencia; variante por composicion, no override ficticio."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un callable recibe tres hooks distintos por parametro y los invoca, pasando el resultado del primero al argumento del segundo y el del segundo al del tercero: esqueleto fijo por composicion, sin herencia ni override. La invocacion de cada hook se acepta como llamada directa (CALLEE_VALUE) o como metodo sobre el hook (RECEIVER), que es la forma de una interfaz funcional en Java. No prueba el orden real de ejecucion mas alla de la cadena de valores, ni pasos en ramas excluyentes, ni que el esqueleto sea reutilizado por varios clientes."
query = '''
query template_method {
 require $unit HAS_PARAMETER $prepare;
 parameter(receiver: false) as $prepare;
 require $unit HAS_PARAMETER $transform;
 parameter(receiver: false) as $transform;
 require $unit HAS_PARAMETER $finish;
 parameter(receiver: false) as $finish;
 different $prepare $transform;
 different $transform $finish;
 different $prepare $finish;
 require $unit HAS_CALL $prepare_call;
 any { require $prepare_call CALLEE_VALUE $prepare; } or { require $prepare_call RECEIVER $prepare; }
 require $unit HAS_CALL $transform_call;
 any { require $transform_call CALLEE_VALUE $transform; } or { require $transform_call RECEIVER $transform; }
 require $unit HAS_CALL $finish_call;
 any { require $finish_call CALLEE_VALUE $finish; } or { require $finish_call RECEIVER $finish; }
 require $prepare_call RESULT $prepared;
 require $transform_call ARGUMENT $transform_argument;
 require $transform_argument VALUE $transform_input;
 path $prepared VALUE_FLOW{0,3} $transform_input as $handoff;
 require $transform_call RESULT $transformed;
 require $finish_call ARGUMENT $finish_argument;
 require $finish_argument VALUE $finish_input;
 path $transformed VALUE_FLOW{0,3} $finish_input as $handoff2;
 emit $unit, $prepare, $transform, $finish;
}
'''

[[operations]]
id = "dependent_steps"
status = "ready"
description = "Two distinct extension slots are invoked on the same modeled instance, passing the first result to the second."
caveat = "Direct argument/result flow only; does not prove dynamic dispatch, global ordering or local alias flow."
query = '''
query template_dependent_steps {
 match "template-method"(unit:$unit);
 require $unit INSTANCE_RECEIVER $self;
 require $unit HAS_METHOD $template;
 require $unit HAS_METHOD $first_slot;
 require $unit HAS_METHOD $second_slot;
 require $override OVERRIDES $first_slot;
 require $template HAS_CALL $first;
 require $template HAS_CALL $second;
 require $first TARGET $first_slot;
 require $second TARGET $second_slot;
 require $first RECEIVER $self;
 require $second RECEIVER $self;
 require $first RESULT $value;
 require $second ARGUMENT $argument;
 require $argument VALUE $value;
 different $first_slot $second_slot;
 different $template $first_slot;
 different $template $second_slot;
 emit $unit,$template,$first,$second;
}
'''
