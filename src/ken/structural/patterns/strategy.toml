schema = "ken-rule/1"
id = "strategy"
name = "Strategy"
category = "behavioral"
description = "A context delegates to a contract with multiple implementations, or to a policy chosen by type."
caveat = "Last supported source writes and contract calls identify supplied-policy composition. Descriptors, hidden effects and temporal order between methods are not resolved. State, Command, Bridge, Decorator and Interpreter can share this structure; algorithm intent requires review. The static variant reads a field whose type is a bound type parameter, so it proves the policy is chosen at compile time, not which instantiation a use site picked."
legacy_query = "require $unit HAS_FIELD $strategy\nrequire $strategy TYPE $contract\nrequire $unit HAS_METHOD $algorithm\nrequire $algorithm DELEGATES_TO $strategy\ncount >=2 $implementation SUBTYPE_OF $contract distinct=$implementation\n"
query = '''
query strategy {
 any { match "strategy#strategy-object"(unit: $unit); }
 or { match "strategy#strategy-callable"(unit: $unit); }
 or { match "strategy#static-policy"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[operations]]
id = "supplied_policy"
status = "ready"
description = "A method writes its supplied parameter last to a field, or retains it through supported constructor initialization."
caveat = "A last source binding write does not prove descriptor/setter storage behavior, heap stability or algorithm intent."
query = '''
query supplied_policy {
 any {
  require $write FINAL_BINDING_INPUT $supplied;
  require $write ASSIGNMENT_TARGET $policy;
  require $configure HAS_OPERATION $write;
 } or {
  require $policy CONSTRUCTOR_FIELD_INPUT $supplied;
  require $configure HAS_PARAMETER $supplied;
  callable(constructor:true) as $configure;
 }
 require $unit HAS_FIELD $policy;
 require $unit HAS_METHOD $configure;
 require $configure HAS_PARAMETER $supplied;
 parameter(receiver:false) as $supplied;
 emit $unit,$configure,$supplied,$policy;
}
'''

[[variants]]
id = "strategy-object"
status = "ready"
languages = ["python", "java", "typescript", "csharp", "cpp"]
requires = ["contract_resolution", "injected_value_flow"]
graph_requirements = ["Consumidor invoca algoritmo recibido; intercambiabilidad por contrato y uso, no solo cantidad de clases."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query strategy {

 match "strategy.supplied_policy"(unit:$unit,configure:$configure,policy:$strategy);
 require $strategy TYPE $contract;
 require $unit HAS_METHOD $algorithm;
 different $configure $algorithm;
 require $algorithm HAS_CALL $call;
 require $call RECEIVER $strategy;
 any { require $call DECLARED_TARGET $slot; }
 or { require $call TARGET $slot; }
 require $contract HAS_METHOD $slot;
 require $first SUBTYPE_OF $contract;
 require $second SUBTYPE_OF $contract;
 different $first $second;
 emit $unit;
}
'''
[[variants]]
id = "strategy-callable"
status = "ready"
languages = ["python", "javascript", "typescript", "go"]
pending_languages = ["java", "csharp", "cpp", "rust"]
requires = ["callable_value_flow", "callback_models"]
graph_requirements = ["Algoritmo funcional suministrado controla variación de operación del consumidor."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"
query_claim = "A supplied callable is stored and invoked by a distinct method; this is strategy-like callback composition, not proof of algorithmic intent or runtime descriptor behavior."
query = '''
query callable_strategy {
 match "strategy.supplied_policy"(unit:$unit,configure:$configure,policy:$policy);
 require $unit HAS_METHOD $algorithm;
 different $configure $algorithm;
 require $algorithm HAS_CALL $call;
 require $call CALLEE_VALUE $policy;
 emit $unit;
}
'''

[[variants]]
id = "static-policy"
status = "ready"
languages = ["cpp", "rust"]
requires = ["generic_substitution", "static_dispatch"]
graph_requirements = ["Política por tipo determina algoritmo; preservar instanciación y no exigir objeto runtime."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-two-languages"
query_claim = "La unidad declara un parametro de tipo, un campo suyo esta tipado por ESE parametro y un metodo no constructor delega en ese campo por receptor. El enlace es por nombre de parametro (`BINDS_TYPE_PARAMETER` y el `TYPE_NAME` del campo), no por resolucion de instanciacion. **No exige objeto runtime**: no pide contrato, subtipo ni implementaciones, que es exactamente lo que separa esta variante de `strategy-object`. No prueba que la instanciacion del sitio de uso sea la que se eligio, ni sustitucion de tipos, ni especializacion parcial, ni que el campo se asigne alguna vez: prueba que la politica esta fijada por tipo en la declaracion."
query = '''
query static_policy {
 require $unit BINDS_TYPE_PARAMETER $parameter;
 require $unit HAS_FIELD $policy;
 require $policy TYPE_NAME $parameter;
 require $unit HAS_METHOD $algorithm;
 callable(constructor: false) as $algorithm;
 require $algorithm HAS_CALL $call;
 require $call RECEIVER $policy;
 emit unit=$unit, $policy, $parameter, $algorithm, $call;
}
'''

[[operations]]
id = "consumed_policy"
status = "ready"
description = "A supplied policy receives a consumer parameter and its invocation result is returned."
caveat = "Positional input and supported return flow; does not prove parameter value stability, runtime contracts or algorithm intent."
query = '''
query same_input_policy_result {
  match "strategy.supplied_policy"(unit:$unit, configure:$configure, policy:$policy);
  require $unit HAS_METHOD $algorithm;
  different $configure $algorithm;
  require $algorithm HAS_PARAMETER $input;
  parameter(receiver:false) as $input;
  require $algorithm HAS_CALL $invocation;
  any { require $invocation RECEIVER $policy; }
  or { require $invocation CALLEE_VALUE $policy; }
  call() as $invocation { has_argument(pos:0, kind:positional) as $argument; }
  require $argument VALUE $read;
  require $read LOADED_FROM $input;
  require $algorithm RETURNS_VALUE $result;
  require $invocation RESULT $result;
  emit $unit, $policy, $algorithm, $invocation, $input, $result;
}
'''
