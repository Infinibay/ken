schema = "ken-rule/1"
id = "visitor"
name = "Visitor"
category = "behavioral"
description = "An element passes itself to a visitor operation, named, overloaded or generic."
caveat = "Self-passing and typed visiting are evidence; exhaustive double dispatch is not proven. The overloaded variant counts same-named operations on the visitor type, so it proves an overload set exists, not that the language picks the branch matching the element's type. The generic variant reads the visitor parameter's type as a type parameter of the element's own method, so it proves compile-time selection of the visitor, not which instantiation a use site chose."
legacy_query = "require $unit HAS_METHOD $accept\nrequire $accept HAS_PARAMETER $visitor receiver=false\nrequire $accept PASSES_SELF_TO $visitor\nrequire $visitor TYPE $visitor_type\nrequire $visitor_type HAS_METHOD $visit\nrequire $visit HAS_PARAMETER $element\nrequire $element TYPE $unit\n"
query = '''
language "kql/2";
module ken.catalog.visitor;
import ken.catalog.visitor.variants.generic_visitor;
import ken.catalog.visitor.variants.named_dispatch;
import ken.catalog.visitor.variants.overloaded_dispatch;

pattern detect(out GraphTerm $unit) {
  either {
    use ken.catalog.visitor.variants.named_dispatch.detect(unit: $unit);
  } or {
    use ken.catalog.visitor.variants.overloaded_dispatch.detect(unit: $unit);
  } or {
    use ken.catalog.visitor.variants.generic_visitor.detect(unit: $unit);
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
query_language = "kql/2"
claim = "structural-signature"

[[variants]]
id = "overloaded-dispatch"
status = "ready"
languages = ["java", "csharp", "cpp"]
requires = ["overload_resolution", "self_value_flow"]
graph_requirements = ["Accept despacha en visitor con elemento actual; overload corresponde a tipo de elemento."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-three-languages"
query_claim = "Un metodo del elemento recibe un parametro visitante, pasa SU PROPIO receptor (`this`, tambien escrito `*this` en C++) como argumento de una llamada cuyo receptor es ese parametro, y el tipo del visitante declara sobrecargas de esa llamada para al menos dos tipos nominales de elemento distintos, incluyendo el tipo del elemento que se pasa a si mismo. Es la forma gemela de `named-dispatch`, que exige un `TARGET` resuelto; aqui lo esencial es que el conjunto exista. No prueba resolucion de sobrecarga: que el lenguaje elija la sobrecarga que corresponde al tipo del elemento, ni exhaustividad del visitante, ni que la sobrecarga elegida sea la del tipo declarado. El conteo es una cota inferior (`>= 2`), no una cardinalidad exacta. El nombre del metodo receptor no se fija: la evidencia es estructural, igual que en `named-dispatch`."
query = '''
language "kql/2";
module ken.catalog.visitor.variants.overloaded_dispatch;

pattern detect(out GraphTerm $unit, out GraphTerm $visitor, out GraphTerm $visitor_type, out GraphTerm $dispatch) {
  type $visitor_type {
    method $local_element_overload {
      param $local_element_parameter { position: 0; type: nominal($unit); }
    }
  }
  type $unit {
    method $local_accept {
      receiver $local_self {}
      param $visitor { type: nominal($visitor_type); }
      body {
        call on $visitor {
          argument $local_self at 0;
          dispatch: possible;
        } as $dispatch;
      }
    }
  }
  at least 2 distinct $local_element_type {
    type $visitor_type {
      method $local_overload {
        param $local_overload_parameter { position: 0; type: nominal($local_element_type); }
      }
    }
    where $local_overload.name == $local_element_overload.name;
  };
}

query results {
  use detect(unit: $unit, visitor: $visitor, visitor_type: $visitor_type, dispatch: $dispatch);
  select $unit, $visitor, $visitor_type, $dispatch;
}
'''

[[variants]]
id = "named-dispatch"
status = "ready"
languages = ["python", "java", "typescript", "cpp"]
requires = ["contract_resolution", "self_value_flow"]
graph_requirements = ["Operaciones distintas del visitor corresponden a distintos elementos que pasan su identidad."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
language "kql/2";
module ken.catalog.visitor.variants.named_dispatch;

pattern detect(out GraphTerm $unit) {
  type $visitor_type {
    method $visit { param $element { type: nominal($unit); } }
  }
  type $unit {
    method $accept {
      receiver $self {}
      param $visitor { type: nominal($visitor_type); }
      body {
        call on $visitor { receiver: $visitor; argument $self for $element; resolution: resolved; unreplaced: true; };
      }
    }
  }
  where $visitor_type != $unit;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
[[variants]]
id = "generic-visitor"
status = "ready"
languages = ["cpp", "rust"]
requires = ["generic_substitution", "self_value_flow"]
graph_requirements = ["Visitor genérico separado recorre familia de elementos; match sin visitor separado no satisface esta variante."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-two-languages"
query_claim = "El metodo del elemento liga un parametro de tipo propio, el parametro visitante esta tipado por ESE parametro de tipo, y el elemento se pasa a si mismo en una llamada cuyo receptor es ese parametro. La seleccion del visitante es por tanto de compilacion, no por un objeto: es lo que separa esta variante de `named-dispatch`, que exige un tipo de visitante resoluble (`class ShapeVisitor`), y el negativo que la ficha nombra —un `match`/`switch` sobre un tipo suma sin visitante separado— no matchea. El enlace es por nombre de parametro de tipo (`BINDS_TYPE_PARAMETER` en el metodo y `TYPE_PARAMETER` en el parametro), y `TYPE_PARAMETER` normaliza la decoracion de referencia: `Visitor &` en C++ y `&V` en Rust cuentan como el parametro. No prueba sustitucion de tipos, ni que la instanciacion del sitio de uso sea la elegida, ni exhaustividad del visitante."
query = '''
language "kql/2";
module ken.catalog.visitor.variants.generic_visitor;

pattern detect(out GraphTerm $unit, out GraphTerm $visitor, out GraphTerm $visitor_parameter, out GraphTerm $dispatch) {
  type $unit {
    method $local_accept {
      receiver $local_self {}
      type_parameter $visitor_parameter;
      param $visitor { type: parameter($visitor_parameter); }
      body {
        call on $visitor { argument $local_self at 0; dispatch: possible; } as $dispatch;
      }
    }
  }
}

query results {
  use detect(unit: $unit, visitor: $visitor, visitor_parameter: $visitor_parameter, dispatch: $dispatch);
  select $unit, $visitor, $visitor_parameter, $dispatch;
}
'''

[[operations]]
id = "result_forwarding"
status = "ready"
description = "A typed visitor receives this element and its dispatch result reaches a return."
caveat = "Explicit source contract; no proof of hidden effects, feasible paths or runtime dispatch."
query = '''
language "kql/2";
module ken.catalog.visitor.result_forwarding;
import ken.catalog.visitor.variants.named_dispatch;

pattern detect(out GraphTerm $unit) {
  use ken.catalog.visitor.variants.named_dispatch.detect(unit: $unit);
  type $visitor_type {
    method $visit { param $element { type: nominal($unit); } }
  }
  type $unit {
    method $accept {
      receiver $self {}
      param $visitor { type: nominal($visitor_type); }
      body {
        call on $visitor { receiver: $visitor; argument $self for $element; resolution: resolved; unreplaced: true; returned: true; };
      }
    }
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
