schema = "ken-rule/1"
id = "visitor"
name = "Visitor"
category = "behavioral"
description = "An element passes itself to a visitor operation, named or overloaded."
caveat = "Self-passing and typed visiting are evidence; exhaustive double dispatch is not proven. The overloaded variant counts same-named operations on the visitor type, so it proves an overload set exists, not that the language picks the branch matching the element's type."
legacy_query = "require $unit HAS_METHOD $accept\nrequire $accept HAS_PARAMETER $visitor receiver=false\nrequire $accept PASSES_SELF_TO $visitor\nrequire $visitor TYPE $visitor_type\nrequire $visitor_type HAS_METHOD $visit\nrequire $visit HAS_PARAMETER $element\nrequire $element TYPE $unit\n"
query = '''
query visitor {
 any { match "visitor#named-dispatch"(unit: $unit); }
 or { match "visitor#overloaded-dispatch"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "overloaded-dispatch"
status = "ready"
languages = ["java", "csharp", "cpp"]
requires = ["overload_resolution", "self_value_flow"]
graph_requirements = ["Accept despacha en visitor con elemento actual; overload corresponde a tipo de elemento."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-three-languages"
query_claim = "Un metodo del elemento recibe un parametro visitante, pasa SU PROPIO receptor (`this`, tambien escrito `*this` en C++) como argumento de una llamada cuyo receptor es ese parametro, y el tipo del visitante declara al menos dos operaciones con el nombre de esa llamada: un conjunto de sobrecargas. Es la forma gemela de `named-dispatch`, que exige un `TARGET` resuelto; aqui lo esencial es que el conjunto exista. No prueba resolucion de sobrecarga: que el lenguaje elija la sobrecarga que corresponde al tipo del elemento, ni exhaustividad del visitante, ni que la sobrecarga elegida sea la del tipo declarado. El conteo es una cota inferior (`>= 2`), no una cardinalidad exacta. El nombre del metodo receptor no se fija: la evidencia es estructural, igual que en `named-dispatch`."
query = '''
query overloaded_dispatch {
 require $unit HAS_METHOD $accept;
 require $accept HAS_PARAMETER $visitor;
 parameter(receiver: false) as $visitor;
 require $unit INSTANCE_RECEIVER $self;
 require $visitor TYPE $visitor_type;
 require $accept HAS_CALL $dispatch;
 require $dispatch RECEIVER $visitor;
 require $dispatch ARGUMENT $self_argument;
 require $self_argument VALUE $self;
 count distinct $overload >= 2 {
  require $visitor_type HAS_METHOD $overload;
  callable() as $overload;
  where $overload.name == $dispatch.name;
 };
 emit unit=$unit, $visitor, $visitor_type, $dispatch;
}
'''

[[variants]]
id = "named-dispatch"
status = "ready"
languages = ["python", "java", "typescript", "cpp"]
requires = ["contract_resolution", "self_value_flow"]
graph_requirements = ["Operaciones distintas del visitor corresponden a distintos elementos que pasan su identidad."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query visitor {

 require $unit HAS_METHOD $accept;
 require $accept HAS_PARAMETER $visitor;
 parameter(receiver: false) as $visitor;
 require $unit INSTANCE_RECEIVER $self;
 require $visitor TYPE $visitor_type;
 require $accept HAS_CALL $dispatch;
 require $dispatch RECEIVER $visitor;
 require $dispatch ARGUMENT $self_argument;
 require $self_argument VALUE $self;
 require $dispatch TARGET $visit;
 require $visitor_type HAS_METHOD $visit;
 require $visit HAS_PARAMETER $element;
 require $element TYPE $unit;
 emit $unit;
}
'''
[[variants]]
id = "generic-visitor"
status = "design"
languages = ["cpp", "rust"]
requires = ["generic_substitution", "self_value_flow"]
graph_requirements = ["Visitor genérico separado recorre familia de elementos; match sin visitor separado no satisface esta variante."]
missing_capability = "unknown"
