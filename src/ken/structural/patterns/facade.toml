schema = "ken-rule/1"
id = "facade"
name = "Facade"
category = "structural"
description = "One surface coordinates multiple subsystem types."
caveat = "Coordination alone cannot establish which API is the intended subsystem boundary."
query = '''
language "kql/2";
module ken.catalog.facade;
import ken.catalog.facade.variants.module_surface;
import ken.catalog.facade.variants.object_surface;

pattern detect(out Entity $unit) {
  either {
    use ken.catalog.facade.variants.object_surface.detect(unit: $unit);
  } or {
    use ken.catalog.facade.variants.module_surface.detect(unit: $unit);
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
query_language = "kql/2"
claim = "structural-signature"

[[variants]]
id = "object-surface"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["call_graph", "module_visibility"]
graph_requirements = ["Superficie de objeto coordina subsistemas y es usada como frontera por clientes."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
language "kql/2";
module ken.catalog.facade.variants.object_surface;

pattern detect(out TypeDecl $unit) {
  type $first_subsystem { method $first_operation {} }
  type $second_subsystem { method $second_operation {} }
  type $unit {
    field $first { type: nominal($first_subsystem); }
    field $second { type: nominal($second_subsystem); }
    method $operation {
      constructor: false;
      body {
        call $first_operation { receiver: $first; dispatch: possible; };
        call $second_operation { receiver: $second; dispatch: possible; };
      }
    }
  }
  where $first != $second;
  where $first_subsystem != $second_subsystem;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
[[variants]]
id = "module-surface"
status = "ready"
languages = ["python", "javascript", "typescript", "go", "rust"]
requires = ["exports", "call_graph", "argument_flow"]
graph_requirements = ["Funciones exportadas coordinan subsistemas; no requerir una clase Facade."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-five-languages"
query_claim = "An exported function transfers a produced value into a second subsystem invocation. A subsystem boundary requires receivers of distinct resolved types, or callees owned by distinct resolved modules. Composing local helper functions alone does not establish Facade. Unresolved imports and dynamically assembled services remain outside this strict signature; distinct types or modules are evidence of a boundary, not proof of architectural intent."

query = '''
language "kql/2";
module ken.catalog.facade.variants.module_surface;

pattern Subsystems(out Callable $first, out Callable $second) {
  either {
    type $first_service { method $first {} }
    type $second_service { method $second {} }
    where $first_service != $second_service;
  } or {
    module_decl $first_module { callable $first {} }
    module_decl $second_module { callable $second {} }
    where $first_module != $second_module;
  }
}

pattern detect(out Callable $unit, out Module $module, out Call $producer, out Call $consumer) {
  use Subsystems(first: $first, second: $second);
  module_decl $module {
    callable $unit {
      exported: true;
      call $producer { target: $first; }
      call $consumer { target: $second; }
      body {
        let $produced = call $producer {};
        call $consumer { argument $produced at any; };
      }
    }
  }
  where $producer != $consumer;
}

query results {
  use detect(unit: $unit, module: $module, producer: $producer, consumer: $consumer);
  select $unit, $module, $producer, $consumer;
}
'''
