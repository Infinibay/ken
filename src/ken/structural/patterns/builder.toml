status = "ready"
description = "A director and a mutable-product builder agree on builder, finalizer and product roles."
caveat = "Correlates definition-level roles; does not prove receiver stability across rebindings, lifecycle or immutable successors."
query = '''
language "kql/2";
module ken.catalog.builder.directed_state;
import ken.catalog.builder.variants.director;
import ken.catalog.builder.variants.mutable_product;

pattern detect(out GraphTerm $builder, out GraphTerm $finish, out GraphTerm $product) {
