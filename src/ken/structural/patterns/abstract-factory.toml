schema = "ken-rule/1"
id = "abstract-factory"
name = "Abstract Factory"
category = "creational"
description = "A factory subtype exposes multiple product creation methods."
caveat = "Structural evidence requires review of intent and runtime behavior."
legacy_query = "require $unit SUBTYPE_OF $factory\ncount >=2 $unit HAS_METHOD $method distinct=$method where $method RETURNS_NEW _\n"
query = '''
query abstract_factory {
 any { match "abstract-factory#nominal-families"(unit: $unit); }
 or { match "abstract-factory#associated-products"(unit: $unit); }
 or { match "abstract-factory#structural-families"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "nominal-families"
status = "ready"
languages = ["python", "java", "typescript", "cpp"]
requires = ["nominal_contracts", "return_flow"]
graph_requirements = ["Correlacionar slots de creación entre familias; distinguir al menos dos contratos de producto; conservar el producto correspondiente a cada slot."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query abstract_factory {

 require $unit SUBTYPE_OF $contract;
 require $unit HAS_METHOD $first;
 require $unit HAS_METHOD $second;
 require $first OVERRIDES $slot1;
 require $second OVERRIDES $slot2;
 require $first RETURNS_NEW $product1;
 require $second RETURNS_NEW $product2;
 require $product1 SUBTYPE_OF $family1;
 require $product2 SUBTYPE_OF $family2;
 different $family1 $family2;
 different $first $second;
 different $product1 $product2;
 emit $unit;
}
'''
[[variants]]
id = "structural-families"
status = "ready"
languages = ["javascript", "typescript", "go"]
requires = ["structural_contracts", "return_flow"]
graph_requirements = ["Relacionar objetos/structs con el mismo conjunto de operaciones de creación sin exigir herencia."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-three-languages"
query_claim = "Dos tipos nominales sin base comun declaran los **mismos slots de creacion** (mismo nombre y aridad), cada slot devuelve una construccion de un tipo distinto, y el producto del mismo slot difiere entre las dos familias mientras los dos productos de una familia difieren entre si. Los slots se unen por **identidad** a traves de `MATCHES_SIGNATURE` (IR 1.69), no comparando nombres, que es lo que evita el producto cartesiano de todas las creaciones. NO resuelve la forma de objeto literal de JavaScript/TypeScript (`const ocean = { createButton: () => ... }`): el IR modela el literal como una coleccion, no como un tipo con miembros. Tampoco prueba que los productos implementen el mismo contrato ni la intencion de familia."
query = '''
query abstract_factory_structural_families {
 require $first IS CLASS;
 require $second IS CLASS;
 different $first $second;
 require $first HAS_METHOD $first_slot;
 require $first_slot MATCHES_SIGNATURE $first_signature;
 require $second HAS_METHOD $second_slot;
 require $second_slot MATCHES_SIGNATURE $first_signature;
 require $first HAS_METHOD $first_other;
 require $first_other MATCHES_SIGNATURE $second_signature;
 require $second HAS_METHOD $second_other;
 require $second_other MATCHES_SIGNATURE $second_signature;
 different $first_signature $second_signature;
 require $first_slot RETURNS_NEW $first_product;
 require $second_slot RETURNS_NEW $second_product;
 require $first_other RETURNS_NEW $third_product;
 require $second_other RETURNS_NEW $fourth_product;
 require $first_product IS CLASS;
 require $second_product IS CLASS;
 require $third_product IS CLASS;
 require $fourth_product IS CLASS;
 different $first_product $second_product;
 different $third_product $fourth_product;
 different $first_product $third_product;
 different $second_product $fourth_product;
 emit unit=$first, $second, $first_slot, $second_slot, $first_product, $second_product, $third_product, $fourth_product;
}
'''

[[variants]]
id = "associated-products"
status = "ready"
languages = ["rust"]
requires = ["trait_resolution", "trait_impl_linkage", "return_flow"]
graph_requirements = ["Sustituir tipos asociados por familia y relacionarlos con los productos devueltos."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-rust"
query_claim = "Un trait declara al menos dos slots de creación; al menos dos tipos lo implementan; cada tipo sobrescribe los dos slots y devuelve tipos concretos distintos entre sí; y el producto del mismo slot difiere entre las dos familias. Las declaraciones 'type X = Y' NO se modelan: el contrato se expresa con los productos realmente devueltos, no con la sustitución del tipo asociado."
query = '''
query abstract_factory {
 require $unit SUBTYPE_OF $contract;
 require $other SUBTYPE_OF $contract;
 different $unit $other;
 require $contract HAS_METHOD $first_slot;
 require $contract HAS_METHOD $second_slot;
 different $first_slot $second_slot;
 require $first_reader OVERRIDES $first_slot;
 require $first_reader IN_TYPE $unit;
 require $first_reader RETURNS $first_product;
 require $first_product IS CLASS;
 require $first_writer OVERRIDES $second_slot;
 require $first_writer IN_TYPE $unit;
 require $first_writer RETURNS $second_product;
 require $second_product IS CLASS;
 different $first_product $second_product;
 require $second_reader OVERRIDES $first_slot;
 require $second_reader IN_TYPE $other;
 require $second_reader RETURNS $third_product;
 require $third_product IS CLASS;
 require $second_writer OVERRIDES $second_slot;
 require $second_writer IN_TYPE $other;
 require $second_writer RETURNS $fourth_product;
 require $fourth_product IS CLASS;
 different $third_product $fourth_product;
 different $first_product $third_product;
 different $second_product $fourth_product;
 emit $unit, $contract;
}
'''
