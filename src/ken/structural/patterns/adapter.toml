schema = "ken-rule/1"
id = "adapter"
name = "Adapter"
category = "structural"
description = "An implementation delegates to a different contract."
caveat = "Structural evidence requires review of intent and runtime behavior."
legacy_query = "require $unit SUBTYPE_OF $target\nrequire $unit HAS_FIELD $field\nrequire $field TYPE $adaptee\nrequire $unit HAS_METHOD $method\nrequire $method DELEGATES_TO $field\ndifferent $target $adaptee\n"
query = '''
query adapter {
 any { match "adapter#object-adapter"(unit: $unit); }
 or { match "adapter#class-adapter"(unit: $unit); }
 or { match "adapter#functional-adapter"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "object-adapter"
status = "ready"
languages = ["python", "java", "typescript", "cpp"]
requires = ["contract_resolution", "argument_result_flow"]
graph_requirements = ["Contrato objetivo cumplido; argumentos/resultados se adaptan al adaptee correlacionado."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query adapter {

 require $unit SUBTYPE_OF $contract;
 require $unit HAS_FIELD $field;
 require $field TYPE $adaptee;
 require $unit HAS_METHOD $method;
 require $method OVERRIDES $slot;
 require $contract HAS_METHOD $slot;
 require $method HAS_CALL $forward;
 require $forward RECEIVER $field;
 call() as $forward;
 callable() as $method;
 different $contract $adaptee;
 where $method.name != $forward.name;
 emit $unit;
}
'''
[[variants]]
id = "functional-adapter"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["closure_capture", "callable_contracts", "argument_adaptation"]
graph_requirements = ["Callable envuelve otra y adapta su contrato de entrada/salida sin requerir clase."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Una fabrica recibe un callable, devuelve un callable propio que lo captura y lo invoca con DOS argumentos distintos, cada uno obtenido indexando el unico parametro de entrada: convierte una estructura de entrada en dos parametros. La invocacion se acepta como llamada directa (CALLEE_VALUE) o como metodo sobre el callable (RECEIVER, la interfaz funcional de Java). No prueba el contrato de tipos de la adaptacion, ni la variante de transformacion de SALIDA, ni que el callable adaptado sea el efectivamente invocado en ejecucion."
query = '''
query adapter {
 require $factory HAS_PARAMETER $inner;
 parameter(receiver: false) as $inner;
 require $factory RETURNS $wrapped;
 different $factory $wrapped;
 callable(constructor: false) as $wrapped;
 require $wrapped CAPTURES $inner;
 require $wrapped HAS_PARAMETER $request;
 parameter(receiver: false) as $request;
 require $wrapped HAS_CALL $delegation;
 any { require $delegation CALLEE_VALUE $inner; } or { require $delegation RECEIVER $inner; }
 count distinct $argument >= 2 {
  require $delegation ARGUMENT $argument;
 };
 require $delegation ARGUMENT $first_argument;
 require $delegation ARGUMENT $second_argument;
 different $first_argument $second_argument;
 require $first_argument VALUE $first_value;
 require $first_value INDEX $first_index;
 require $second_argument VALUE $second_value;
 require $second_value INDEX $second_index;
 emit unit=$wrapped, $factory, $inner, $wrapped, $request;
}
'''

[[variants]]
id = "class-adapter"
status = "ready"
languages = ["python", "cpp"]
requires = ["multiple_inheritance", "override_resolution"]
graph_requirements = ["Herencia del adaptee y cumplimiento del contrato objetivo; resolver método efectivamente invocado."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-python-cpp"
query_claim = "La clase hereda de dos bases distintas, sobrescribe el slot que una de ellas declara, y dentro de esa sobrescritura invoca un metodo que la otra base declara: adaptacion por herencia, no por campo. La desigualdad de nombres no define el patron: la query no compara nombres. No prueba el MRO completo de Python ni el orden de bases de C++ mas alla de que ambas existan, ni que el slot se invoque en ejecucion. LIMITE: una adaptacion con el MISMO nombre de metodo en ambas bases exige calificacion explicita (Adaptee::request(), Adaptee.request(self)), que hoy no se resuelve; ese caso queda como falso negativo declarado."
query = '''
query adapter {
 require $unit SUBTYPE_OF $target;
 require $unit SUBTYPE_OF $adaptee;
 different $target $adaptee;
 require $target HAS_METHOD $slot;
 require $unit HAS_METHOD $override;
 require $override OVERRIDES $slot;
 require $override HAS_CALL $call;
 require $call TARGET $delegate;
 require $adaptee HAS_METHOD $delegate;
 emit $unit, $target, $adaptee, $slot, $override, $delegate;
}
'''
