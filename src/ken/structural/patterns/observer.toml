schema = "ken-rule/1"
id = "observer"
name = "Observer"
category = "behavioral"
description = "A subject broadcasts a call to a collection of listeners."
caveat = "Broadcast iteration is Observer-like; subscription lifecycle and event semantics require review."
legacy_query = "require $unit HAS_FIELD $listeners\nrequire $unit HAS_METHOD $notify\nrequire $notify ITERATES_CALLS $listeners\n"
query = '''
query observer {
 any { match "observer#listener-registry"(unit: $unit); }
 or { match "observer#map-key-registry"(unit: $unit); }
 or { match "observer#snapshot-registry"(unit: $unit); }
 or { match "observer#language-event"(unit: $unit); }
 or { match "observer#event-bus"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "listener-registry"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["collection_mutation", "callback_flow"]
graph_requirements = ["Registro agrega listener al mismo conjunto que notifica evento; correlacionar listener y payload."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query observer {

 require $insertion INSERTS_INTO $listeners;
 require $insertion INSERTED_VALUE $listener;
 require $subscribe HAS_CALL $insertion;
 require $subscribe HAS_PARAMETER $listener;
 parameter(receiver: false) as $listener;
 require $unit HAS_FIELD $listeners;
 require $unit HAS_METHOD $subscribe;
 require $unit HAS_METHOD $notify;
 require $notify ITERATES_CALLS $listeners;
 different $subscribe $notify;
 emit $unit;
}
'''
[[variants]]
id = "map-key-registry"
status = "ready"
languages = ["go"]
fixtures_status = "source-regression-matrix"
query_claim = "A supplied listener is used as a map key and another method invokes keys of the same map. Lifecycle and event semantics still require review."
query = '''
query map_key_registry {
 type_decl(language: go) as $unit;
 require $unit HAS_FIELD $listeners;
 variable(native_type: /^map\[/) as $listeners;
 require $unit HAS_METHOD $subscribe;
 require $subscribe HAS_PARAMETER $listener;
 parameter(receiver: false) as $listener;
 require $subscribe HAS_OPERATION $write;
 require $write WRITES_ELEMENT $listeners;
 require $write INDEX $listener;
 require $unit HAS_METHOD $notify;
 different $subscribe $notify;
 require $notify ITERATES_KEYS_CALLS $listeners;
 emit $unit;
}
'''

[[variants]]
id = "snapshot-registry"
status = "ready"
languages = ["python", "javascript", "typescript"]
fixtures_status = "source-regression-matrix"
query_claim = "A method, or a callback it passes to a call, registers a supplied listener in the field copied for notification. Standard builtin copy models are assumed; callback execution and event lifecycle are not proven."
query = '''
query snapshot_registry {
 require $iteration ITERATION_SNAPSHOT $copy;
 require $copy COLLECTION_SNAPSHOT_OF $listeners;
 require $iteration ITERATION_INVOKES_VALUE $invocation;
 require $notify HAS_CALL $invocation;
 require $unit HAS_METHOD $notify;
 require $unit HAS_FIELD $listeners;
 require $insertion INSERTS_INTO $listeners;
 require $insertion INSERTED_VALUE $listener;
 require $subscribe HAS_CALL $insertion;
 require $subscribe HAS_PARAMETER $listener;
 parameter(receiver: false) as $listener;
 any { require $unit HAS_METHOD $subscribe; }
 or {
   require $subscribe OWNED_BY $registration;
   require $unit HAS_METHOD $registration;
   require $registration HAS_CALL $setup;
   require $setup ARGUMENT $callback;
   require $callback VALUE $subscribe;
   different $registration $notify;
 }
 different $subscribe $notify;
 emit $unit;
}
'''

[[variants]]
id = "language-event"
status = "ready"
languages = ["csharp"]
requires = ["event_lowering", "handler_registration", "nominal_member_resolution"]
graph_requirements = ["Event add/remove/invoke se modelan como registro y notificación con identidad del evento."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-csharp"
query_claim = "El tipo declara un event de C#, un método registra un handler, otro lo da de baja y otro lo emite, todo sobre el mismo almacenamiento. No prueba la correlación payload→parámetro del handler, ni orden temporal, ni unicidad de entrega."
query = '''
query observer {
 require $unit DECLARES_EVENT $event;
 require $attach ADDS_HANDLER $event;
 require $detach REMOVES_HANDLER $event;
 different $attach $detach;
 require $raise HAS_CALL $call;
 require $call RAISES_EVENT $event;
 emit $unit, $event, $attach, $detach, $raise;
}
'''

[[variants]]
id = "event-bus"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["event_api_models", "topic_flow"]
graph_requirements = ["Subscribe y publish comparten bus/topic resueltos; preservar restricciones y delivery desconocido."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un bus con un registro y un **slot de topic** compartidos: el alta inserta el subscriber en el registro **bajo ese topic** y la publicacion recorre el registro **bajo el mismo topic** invocando el elemento con el payload. El topic se une **por identidad de entidad**, no comparando cadenas: es el mismo campo en los dos lados. El acceso al registro se acepta en sus dos formas, porque los lenguajes se reparten: sintaxis de indice (`handlers[topic]`: Go, JS/TS, C#, C++, Rust), donde el acceso lleva `CONTAINER`/`INDEX` y es lo que apunta `INSERTS_INTO`, o sintaxis de metodo (Python `dict.setdefault`/`get`, Java `Map.computeIfAbsent`/`get`), donde el acceso es una llamada con el registro de receptor y el topic como argumento 0; Java ademas liga el bucket a un local antes de iterar. NO prueba entrega exactamente una vez, ni orden, ni que el topic no se reasigne, ni que el subscriber se invoque de verdad en ejecucion; tampoco que el registro no se comparta con otros topics."
query = '''
query observer_event_bus {
 require $unit IS CLASS;
 require $unit HAS_FIELD $registry;
 require $unit HAS_FIELD $topic;
 require $unit HAS_METHOD $subscription;
 require $unit HAS_METHOD $publication;
 different $subscription $publication;
 require $subscription HAS_PARAMETER $subscriber;
 parameter(receiver: false) as $subscriber;
 require $subscription HAS_CALL $insert;
 require $insert INSERTED_VALUE $subscriber;
 require $insert INSERTS_INTO $registration_bucket;
 any {
  require $registration_bucket CONTAINER $registry;
  require $registration_bucket INDEX $topic;
 } or {
  require $registration_bucket RECEIVER $registry;
  require $registration_bucket ARGUMENT $registration_argument;
  require $registration_argument VALUE $registration_value;
  require $registration_value LOADED_FROM $topic;
 }
 require $publication HAS_PARAMETER $payload;
 parameter(receiver: false) as $payload;
 require $publication ITERATES_CALLS $publication_bucket;
 any {
  require $publication_bucket CONTAINER $registry;
  require $publication_bucket INDEX $topic;
 } or {
  require $publication_bucket RECEIVER $registry;
  require $publication_bucket ARGUMENT $publication_argument;
  require $publication_argument VALUE $publication_value;
  require $publication_value LOADED_FROM $topic;
 } or {
  require $publication_bucket ASSIGNED_FROM $lookup;
  require $lookup RECEIVER $registry;
  require $lookup ARGUMENT $lookup_argument;
  require $lookup_argument VALUE $lookup_value;
  require $lookup_value LOADED_FROM $topic;
 }
 require $publication HAS_OPERATION $iteration;
 require $iteration ITERATION_INVOKES_VALUE $invocation;
 require $invocation ARGUMENT $invocation_argument;
 require $invocation_argument VALUE $invocation_value;
 require $invocation_value LOADED_FROM $payload;
 emit unit=$unit, $subscription, $publication, $registry, $topic, $subscriber, $payload, $invocation;
}
'''
