      method $first_caller {
        param $first_center { type: nominal($unit); }
        body { call $coordinate { receiver: $first_center; dispatch: possible; }; }
      }
    }
  }
  either {
    class $second_type {
      field $second_mediator { type: nominal($unit); }
      method $second_caller {
        body { call $coordinate { receiver: $second_mediator; dispatch: possible; }; }
      }
    }
  } or {
    class $second_type {
      method $second_caller {
        param $second_center { type: nominal($unit); }
        body { call $coordinate { receiver: $second_center; dispatch: possible; }; }
      }
    }
  }
  class $unit {
    method $coordinate {
      body { call $first_operation { receiver: $first; dispatch: possible; }; }
      body { call $second_operation { receiver: $second; dispatch: possible; }; }
    }
  }
  where $first != $second;
  where $unit != $first_type and $unit != $second_type;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
