[[variants]]
id = "broadcast-colleagues"
status = "ready"
languages = ["java", "csharp"]
requires = ["collection_api_shape", "iteration_call", "override_resolution"]
graph_requirements = ["El coordinador retiene una coleccion de colegas, la registra y la recorre invocandolos; los colegas retienen al coordinador y vuelven a llamarlo."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"
query_claim = "Un tipo con un campo de coleccion tiene un metodo que **registra elementos** en ella y otro que la **recorre invocando** a sus elementos; ademas existe un tipo colega con un campo propio cuyo metodo **vuelve a llamar** a la operacion del coordinador — el enlace se acredita tambien a traves de la implementacion que sobrescribe el slot declarado. No prueba orden de notificacion, exclusividad, ni que el coordinador distinga emisor y destinatario."
query = '''
language "kql/2";
module ken.catalog.mediator.variants.broadcast_colleagues;

pattern detect(out TypeDecl $unit) {
  type $colleague {
    field $own { }
    method $caller { constructor: false; }
  }
  type $unit {
    field $colleagues { }
    method $register { constructor: false; }
    method $coordinate { constructor: false; }
  }
  where writes_element($register, $colleagues);
  where iterates_calls($coordinate, $colleagues);
  where possible_call($caller, $coordinate);
  where $unit != $colleague;
  where $register != $coordinate;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''

[[operations]]
id = "event_delivery"
status = "ready"
description = "Bidirectional colleagues receive the incoming coordination event on both destination fields."
caveat = "Explicit source contract; no proof of hidden effects, feasible paths or runtime dispatch."
query = '''
language "kql/2";
module ken.catalog.mediator.event_delivery;
import ken.catalog.mediator.variants.broadcast_colleagues;
import ken.catalog.mediator.variants.direct_colleagues;

pattern detect(out TypeDecl $unit, out Callable $coordinate, out Parameter $event) {
  use ken.catalog.mediator.variants.direct_colleagues.detect(unit: $unit);
  type $unit {
    field $first_target {}
    field $second_target {}
    method $coordinate {
      param $event { reassigned: false; }
      body {
        if ($event == _) { call $first_delivery { receiver: $first_target; resolution: any; argument $event at 0; }; }
        else { call $second_delivery { receiver: $second_target; resolution: any; argument $event at 0; }; }
      }
    }
  }
  where $first_target != $second_target;
}

query results {
  use detect(unit: $unit, coordinate: $coordinate, event: $event);
  select $unit, $coordinate, $event;
}
'''
