    fields {
      field $first { type: nominal($first_type); }
      field $second { type: nominal($second_type); }
    }
    method $coordinate {}
  }
  either {
    class $first_type {
      field $first_mediator { type: nominal($unit); }
      method $first_caller {
        body { call $coordinate { receiver: $first_mediator; dispatch: possible; }; }
      }
    }
  } or {
