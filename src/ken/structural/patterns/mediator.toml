schema = "ken-rule/1"
id = "mediator"
name = "Mediator"
category = "behavioral"
description = "A central object is called by and delegates to multiple colleagues."
caveat = "Structural evidence requires review of intent and runtime behavior."
legacy_query = "require $unit HAS_METHOD $coordinate\ncount >=2 $caller CALLS $coordinate distinct=$caller\ncount >=2 $coordinate DELEGATES_TYPE $colleague distinct=$colleague\n"
query = '''
query mediator {
 any { match "mediator#direct-colleagues"(unit: $unit); }
 or { match "mediator#message-coordination"(unit: $unit); }
 or { match "mediator#tag-dispatch"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "direct-colleagues"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["call_graph", "event_value_flow"]
graph_requirements = ["Varios colegas notifican al centro y eventos gobiernan acciones del centro hacia colegas."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query mediator {

 require $unit HAS_METHOD $coordinate;
 require $coordinate DELEGATES_TYPE $first;
 require $coordinate DELEGATES_TYPE $second;
 require $first HAS_METHOD $caller1;
 require $second HAS_METHOD $caller2;
 require $caller1 CALLS $coordinate;
 require $caller2 CALLS $coordinate;
 different $first $second;
 different $unit $first;
 different $unit $second;
 emit $unit;
}
'''
[[variants]]
id = "message-coordination"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["message_api_models", "callback_flow"]
graph_requirements = ["Mensajes/callbacks sustituyen referencias bidireccionales; correlacionar canal/evento y destinos."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un centro con un metodo que **despacha por tag**: dos ramas delegan condicionalmente en **dos campos distintos del propio centro**, y la llamada de cada rama lleva un argumento cargado del **mismo parametro** (el tag). El centro esta ademas **llamado por dos tipos distintos** que se pasan a si mismos (`PASSES_SELF_TO`) invocando un metodo cuyo nombre coincide con el del despachador. Los campos destino no tienen que estar tipados por un contrato comun, y en JavaScript el centro inyectado no tiene tipo registrado: por eso el enlace es por nombre de llamada, el mismo idioma que `composite#recursive-nominal`. NO prueba que las dos ramas sean el `then` y el `else` de un mismo test, ni que los valores del tag difieran, ni la identidad runtime de los destinos, ni que la notificacion retorne. Los lenguajes declarados son los validados; la query no filtra por lenguaje."
query = '''
query mediator_message_coordination {
 require $coordinator IS CLASS;
 require $coordinator HAS_METHOD $operation;
 require $operation CONDITIONAL_DELEGATION $first_target;
 require $coordinator HAS_FIELD $first_target;
 require $operation CONDITIONAL_DELEGATION $second_target;
 require $coordinator HAS_FIELD $second_target;
 different $first_target $second_target;
 require $operation HAS_CALL $first_call;
 require $first_call RECEIVER $first_target;
 require $operation HAS_CALL $second_call;
 require $second_call RECEIVER $second_target;
 require $operation HAS_PARAMETER $tag;
 parameter(receiver: false) as $tag;
 require $first_call ARGUMENT $first_argument;
 require $first_argument VALUE $first_value;
 require $first_value LOADED_FROM $tag;
 require $second_call ARGUMENT $second_argument;
 require $second_argument VALUE $second_value;
 require $second_value LOADED_FROM $tag;
 require $notifier_a PASSES_SELF_TO $holder_a;
 require $notifier_a IN_TYPE $colleague_a;
 require $notifier_a HAS_CALL $outgoing_a;
 require $outgoing_a CALLEE_NAME $name_a;
 require $notifier_b PASSES_SELF_TO $holder_b;
 require $notifier_b IN_TYPE $colleague_b;
 require $notifier_b HAS_CALL $outgoing_b;
 require $outgoing_b CALLEE_NAME $name_b;
 different $colleague_a $colleague_b;
 different $notifier_a $notifier_b;
 where $name_a == $operation.name;
 where $name_b == $operation.name;
 emit unit=$coordinator, $operation, $first_target, $second_target, $tag, $colleague_a, $colleague_b;
}
'''

[[variants]]
id = "tag-dispatch"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["call_graph", "event_value_flow", "branch_dispatch"]
graph_requirements = ["El centro despacha por una etiqueta que recibe por parametro: una rama del propio metodo compara ese parametro y cada rama delega en un campo distinto del centro, y dos tipos colegas se pasan a si mismos al centro y lo llaman por el mismo nombre de operacion."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un centro con un metodo que **despacha por etiqueta**: el metodo recibe la etiqueta como parametro, una rama del propio metodo la **compara** (``if tag == 1`` / ``switch``-like), y las dos ramas delegan condicionalmente en **dos campos distintos del mismo centro**. El centro esta ademas llamado por **dos tipos colegas** que se pasan a si mismos y lo invocan con el nombre de esa operacion. Es la forma canonica del ejemplo de RefactoringGuru (``notify(sender, event)`` ramificando sobre ``event``); el hermano ``message-coordination`` cubre la otra grafia, donde la etiqueta se **reenvia** como argumento de cada llamada. No prueba orden temporal, exclusividad de ramas ni que la etiqueta sea el unico criterio de despacho. La comparacion tiene que ser un operador; ``event.equals(\"A\")`` (Java) o un ``switch`` sobre un campo no publican el hecho todavia."
query = '''
query mediator_tag_dispatch {
 require $coordinator IS CLASS;
 require $coordinator HAS_METHOD $operation;
 require $operation HAS_PARAMETER $tag;
 parameter(receiver: false) as $tag;
 require $operation CONDITIONAL_DELEGATION $first_target;
 require $coordinator HAS_FIELD $first_target;
 require $operation CONDITIONAL_DELEGATION $second_target;
 require $coordinator HAS_FIELD $second_target;
 different $first_target $second_target;
 require $operation HAS_CALL $first_call;
 require $first_call RECEIVER $first_target;
 require $operation HAS_CALL $second_call;
 require $second_call RECEIVER $second_target;
 require $operation HAS_OPERATION $branch;
 require $branch PARAMETER_TEST $tag;
 require $notifier_a PASSES_SELF_TO $holder_a;
 require $notifier_a IN_TYPE $colleague_a;
 require $notifier_a HAS_CALL $outgoing_a;
 require $outgoing_a CALLEE_NAME $name_a;
 require $notifier_b PASSES_SELF_TO $holder_b;
 require $notifier_b IN_TYPE $colleague_b;
 require $notifier_b HAS_CALL $outgoing_b;
 require $outgoing_b CALLEE_NAME $name_b;
 different $colleague_a $colleague_b;
 different $notifier_a $notifier_b;
 where $name_a == $operation.name;
 where $name_b == $operation.name;
 emit unit=$coordinator, $operation, $first_target, $second_target, $tag, $colleague_a, $colleague_b;
}
'''
