schema = "ken-rule/1"
id = "mediator"
name = "Mediator"
category = "behavioral"
description = "A central object is called by and delegates to multiple colleagues."
caveat = "Structural evidence requires review of intent and runtime behavior."
legacy_query = "require $unit HAS_METHOD $coordinate\ncount >=2 $caller CALLS $coordinate distinct=$caller\ncount >=2 $coordinate DELEGATES_TYPE $colleague distinct=$colleague\n"
query = '''
language "kql/2";
module ken.catalog.mediator;
import ken.catalog.mediator.variants.broadcast_colleagues;
import ken.catalog.mediator.variants.direct_colleagues;
import ken.catalog.mediator.variants.message_coordination;
import ken.catalog.mediator.variants.registered_colleagues;
import ken.catalog.mediator.variants.tag_dispatch;

pattern detect(out GraphTerm $unit) {
  either {
    use ken.catalog.mediator.variants.broadcast_colleagues.detect(unit: $unit);
  } or {
    use ken.catalog.mediator.variants.direct_colleagues.detect(unit: $unit);
  } or {
    use ken.catalog.mediator.variants.message_coordination.detect(unit: $unit);
  } or {
    use ken.catalog.mediator.variants.tag_dispatch.detect(unit: $unit);
  } or {
    use ken.catalog.mediator.variants.registered_colleagues.detect(unit: $unit);
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
query_language = "kql/2"
claim = "structural-signature"

[[variants]]
id = "direct-colleagues"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["call_graph", "event_value_flow"]
graph_requirements = ["Varios colegas notifican al centro y eventos gobiernan acciones del centro hacia colegas."]
query_claim = "Coordinación bidireccional por contratos: el centro llama operaciones sobre dos campos de colegas y métodos de esos tipos invocan la operación del centro. Los colegas pueden recibir el centro como parámetro o retenerlo; no se afirma identidad runtime entre instancias ni enrutamiento por evento. La variante registered-colleagues exige además retención nominal del centro."
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
language "kql/2";
module ken.catalog.mediator.variants.direct_colleagues;
import ken.core;

pattern detect(out TypeDecl $unit) {
  class $first_type {}
  class $second_type {}
  class $unit {
    fields {
      field $first { type: nominal($first_type); }
      field $second { type: nominal($second_type); }
    }
    method $coordinate {
      body { call $first_operation { receiver: $first; dispatch: possible; }; }
      body { call $second_operation { receiver: $second; dispatch: possible; }; }
    }
  }
  class $first_type {
    method $first_caller {
      body { call $coordinate { dispatch: possible; }; }
    }
  }
  class $second_type {
    method $second_caller {
      body { call $coordinate { dispatch: possible; }; }
    }
  }
  where $first != $second;
  where $unit != $first_type and $unit != $second_type;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
