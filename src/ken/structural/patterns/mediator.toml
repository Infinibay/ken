id = "message-coordination"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["message_api_models", "callback_flow"]
graph_requirements = ["Mensajes/callbacks sustituyen referencias bidireccionales; correlacionar canal/evento y destinos."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Un centro con un metodo que **despacha por tag**: dos ramas delegan condicionalmente en **dos campos distintos del propio centro**, y la llamada de cada rama lleva un argumento cargado del **mismo parametro** (el tag). El centro esta ademas **llamado por dos tipos distintos** que pasan su propia identidad como argumento de ESA llamada, sobre el mismo receptor de PASSES_SELF_TO, invocando un metodo cuyo nombre coincide con el del despachador. Los campos destino no tienen que estar tipados por un contrato comun, y en JavaScript el centro inyectado no tiene tipo registrado: por eso el enlace es por nombre de llamada, el mismo idioma que `composite#recursive-nominal`. NO prueba que las dos ramas sean el `then` y el `else` de un mismo test, ni que los valores del tag difieran, ni la identidad runtime de los destinos, ni que la notificacion retorne. Los lenguajes declarados son los validados; la query no filtra por lenguaje."
query = '''
language "kql/2";
module ken.catalog.mediator.variants.message_coordination;

pattern detect(out TypeDecl $unit, out Callable $operation, out Field $first_target, out Field $second_target, out Parameter $tag, out TypeDecl $colleague_a, out TypeDecl $colleague_b) {
  type $unit {
    field $first_target {}
    field $second_target {}
    method $operation {
      param $tag {}
      body {
        if ($tag == _) { call $first_delegate { receiver: $first_target; resolution: any; argument $tag at 0; }; }
        else { call $second_delegate { receiver: $second_target; resolution: any; argument $tag at 0; }; }
      }
    }
  }
  type $colleague_a {
    field $holder_a {}
    method $notifier_a {
      receiver $self_a {}
      body { call $outgoing_a { receiver: $holder_a; resolution: any; argument $self_a at 0; }; }
    }
  }
  type $colleague_b {
    field $holder_b {}
    method $notifier_b {
      receiver $self_b {}
      body { call $outgoing_b { receiver: $holder_b; resolution: any; argument $self_b at 0; }; }
    }
  }
  where $first_target != $second_target;
  where $colleague_a != $colleague_b;
  where $outgoing_a.name == $operation.name and $outgoing_b.name == $operation.name;
}

query results {
  use detect(unit: $unit, operation: $operation, first_target: $first_target, second_target: $second_target, tag: $tag, colleague_a: $colleague_a, colleague_b: $colleague_b);
  select $unit, $operation, $first_target, $second_target, $tag, $colleague_a, $colleague_b;
}
'''

