schema = "ken-rule/1"
id = "command"
name = "Command"
category = "behavioral"
description = "An operation encapsulates a receiver invocation; retained contracts may accept an execution context."
caveat = "A retained action with matching explicit call arity, another parameterless action shape, or a stored captured closure. Discarded calls and stateful getters can share the signature; intent and invocation lifecycle remain unproven."
query = '''
language "kql/2";
module ken.catalog.command;
import ken.catalog.command.variants.command_closure;
import ken.catalog.command.variants.command_object;
import ken.catalog.command.variants.queued_object;
import ken.catalog.command.variants.retained_contract;
import ken.catalog.command.variants.retained_object;
import ken.catalog.command.variants.stored_closure;

pattern detect(out GraphTerm $unit) {
  either {
    use ken.catalog.command.variants.command_object.detect(unit: $unit);
  } or {
    use ken.catalog.command.variants.stored_closure.detect(unit: $unit);
  } or {
    use ken.catalog.command.variants.retained_object.detect(unit: $unit);
  } or {
    use ken.catalog.command.variants.queued_object.detect(unit: $unit);
  } or {
    use ken.catalog.command.variants.retained_contract.detect(unit: $unit);
  } or {
    use ken.catalog.command.variants.command_closure.detect(unit: $unit);
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
query_language = "kql/2"
claim = "structural-signature"

[[operations]]
id = "retained_dispatch"
status = "ready"
description = "An invoker retains an input with a nominal contract and dispatches a slot with matching explicit arity from another method."
caveat = "Requires a supported final field transfer or constructor input. Does not prove temporal call order, unchanged runtime fields, dispatch to a particular subtype or Command intent."
query = '''
language "kql/2";
module ken.catalog.command.retained_dispatch;

pattern detect(out GraphTerm $invoker, out GraphTerm $setter, out GraphTerm $input, out GraphTerm $storage, out GraphTerm $invoke, out Call $dispatch, out GraphTerm $contract, out GraphTerm $slot) {
  type $contract {
    method $slot { constructor: false; }
  }
  type $invoker {
    field $storage { }
    method $invoke {
      constructor: false;
      body { call $slot { receiver: $storage; unreplaced: true; } as $dispatch; }
    }
    either {
      method $setter {
        constructor: false;
        param $input { type: nominal($contract); reassigned: false; }
        body { $storage = $input as $write; }
      }
      where final_member_input($write, $input);
    } or {
      constructor $setter {
        param $input { type: nominal($contract); reassigned: false; }
        body { initializer { $storage = $input; } }
      }
    }
  }
  where $setter != $invoke;
  where $dispatch.explicit_arguments == $slot.arity;
}

query results {
  use detect(invoker: $invoker, setter: $setter, input: $input, storage: $storage, invoke: $invoke, dispatch: $dispatch, contract: $contract, slot: $slot);
  select $invoker, $setter, $input, $storage, $invoke, $dispatch, $contract, $slot;
}
'''

[[variants]]
id = "retained-contract"
status = "ready"
languages = ["python", "typescript", "java", "csharp", "cpp"]
query_claim = "An invoker retains a nominal contract and later has a separate dispatch method. A corresponding concrete subtype retains a constructor receiver and discards the result of a receiver call in its action. Existence of an override does not prove that runtime dispatch selects it; retention and intent are structural evidence."
query = '''
language "kql/2";
module ken.catalog.command.variants.retained_contract;
import ken.catalog.command.retained_dispatch;

pattern detect(out GraphTerm $unit) {
  use ken.catalog.command.retained_dispatch.detect(invoker: $local_invoker, contract: $local_contract, slot: $local_slot);
  type $unit {
    field $local_receiver {}
    method $local_execute { constructor: false; }
    constructor $local_constructor {
      parameters { param $local_receiver_input {} }
      body { initializer { $local_receiver = $local_receiver_input; } }
    }
  }
  where subtype($unit, $local_contract);
  where overrides($local_execute, $local_slot);
  type $unit { method $local_execute { body { call $local_work { receiver: $local_receiver; discarded: true; }; } } }
  where $unit != $local_invoker;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
[[variants]]
id = "command-object"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["storage_escape", "deferred_invocation"]
graph_requirements = ["Objeto retiene acción/datos; invocador separado lo almacena o transmite antes de ejecutar."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
language "kql/2";
module ken.catalog.command.variants.command_object;

pattern detect(out GraphTerm $unit) {
  type $unit {
    method $local_execute { constructor: false; arity: 0; }
    field $local_receiver { type: nominal($local_receiver_type); }
  }
  either {
    type $unit {
      method $local_execute {
        body { call $local_action { receiver: $local_receiver; discarded: true; }; }
      }
    }
  } or {
    type $unit {
      method $local_execute {
        body {
          let $local_result = call $local_action { receiver: $local_receiver; } as $local_work;
          return $local_result;
        }
      }
    }
    type $local_receiver_type {
      method $local_action { constructor: false; }
      field $local_state {}
    }
    either {
      where writes($local_action, $local_state);
    } or {
      where writes_element($local_action, $local_state);
    }
  }
  method $local_invoker {
    constructor: false;
    param $local_command { type: nominal($unit); }
    body { call $local_execute { receiver: $local_command; } as $local_dispatch; }
  }
  where $local_invoker != $local_execute;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
[[variants]]
id = "stored-closure"
status = "ready"
languages = ["python", "javascript", "typescript", "go", "csharp"]
requires = ["closure_capture", "callable_value_flow", "stored_callback_invocation"]
graph_requirements = ["A stored closure captures an outer callable binding and is invoked through that same field by another method."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"
query_claim = "Deferred action shape, not proof of Command intent versus a captured Strategy, temporal ordering, exactly-once execution or unchanged instance fields."
query = '''
language "kql/2";
module ken.catalog.command.variants.stored_closure;

pattern detect(out GraphTerm $unit) {
  type $unit {
    field $action {}
    method $invoke { constructor: false; body { call $action {} as $dispatch; } }
  }
  callable $closure {
    constructor: false;
    captures: $bound;
    body { call $inner { argument $bound at any; } as $use; }
  }
  either {
    type $unit {
      method $configure { constructor: false; body { $action = $closure as $write; } }
    }
  } or {
    callable $producer {
      constructor: false;
      body { let $made = construct $unit { initializer $action from $closure; } as $new; }
    }
  }
  where $closure != $invoke;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''

[[variants]]
id = "retained-object"
status = "ready"
languages = ["python", "java", "typescript", "csharp"]
query_claim = "An invoker retains a supplied command object and dispatches its parameterless receiver delegation from another method. Pure calculations may qualify. Stored query objects can share this shape; ordering, alias stability and intent remain unproven."
query = '''
language "kql/2";
module ken.catalog.command.variants.retained_object;

pattern detect(out TypeDecl $unit) {
  type $receiver_type {
    method $work { constructor: false; }
  }
  type $unit {
    field $receiver { type: nominal($receiver_type); }
    method $execute {
      constructor: false;
      body {
        call $work { receiver: $receiver; };
      }
    }
  }
  type $invoker {
    field $slot { type: nominal($unit); }
    method $setter {
      constructor: false;
      param $command { type: nominal($unit); }
      body {
        $slot = $command as $store;
      }
    }
    method $invoke {
      constructor: false;
      body {
        call $execute { receiver: $slot; };
      }
    }
  }
  where $invoker != $unit;
  where $setter != $invoke;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''

[[variants]]
id = "command-closure"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["closure_capture", "callable_value_flow", "stored_callback_invocation"]
graph_requirements = ["Closure captura accion/datos y fluye a invocador diferido; respetar FnOnce y move cuando corresponda."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "Una fabrica encola un cierre que captura un payload, y otro metodo recorre esa misma cola invocando cada elemento con un contexto de ejecucion que recibe por parametro. El cierre tiene aridad al menos uno (no se impone aridad cero) y lee el payload capturado, de modo que los datos llegan a la accion. La identidad del cierre encolado se sigue a traves del alias local o del envoltorio de un solo argumento con el que cada lenguaje lo guarda. No prueba orden temporal, ejecucion exactamente una vez, ni FnOnce/move."
query = '''
language "kql/2";
module ken.catalog.command.variants.command_closure;

pattern detect(out GraphTerm $unit, out GraphTerm $queue, out GraphTerm $submit, out GraphTerm $run, out GraphTerm $action) {
  callable $action {
    constructor: false;
    captures: $local_payload;
    parameters { param $local_context {} }
  }
  type $unit {
    field $queue {}
    method $submit { constructor: false; }
    method $run { constructor: false; param $local_execution {} }
  }
  where $submit != $run;
  where reads($action, $local_payload);
  method $submit {
    body {
      insert $action into $queue as $local_insertion;
    }
  }
  either {
    method $run {
      body {
        iterate $queue as $local_element {
          body {
            call $local_element { argument $local_execution at any; } as $local_dispatch;
          }
        }
      }
    }
  } or {
    method $run {
      body {
        iterate $queue as $local_element {
          body {
            call on $local_element { argument $local_execution at any; } as $local_dispatch;
          }
        }
      }
    }
  }
}

query results {
  use detect(unit: $unit, queue: $queue, submit: $submit, run: $run, action: $action);
  select $unit, $queue, $submit, $run, $action;
}
'''

[[variants]]
id = "queued-object"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp"]
query_claim = "A batch invoker stores supplied commands, invokes a parameterless operation on each element, and lexically resets the same collection. A concrete operation corresponding to the registered contract delegates to a constructor-retained receiver. Untyped registration requires an observed caller supplying the concrete type. Does not prove runtime scheduling, exactly-once execution or exclusive Command intent."
query = '''
language "kql/2";
module ken.catalog.command.variants.queued_object;
import ken.catalog.architecture.batch_work_queue.drain;

pattern detect(out TypeDecl $unit) {
  use ken.catalog.architecture.batch_work_queue.drain.detect(unit: $local_invoker, register: $local_register, input: $local_input, dispatch: $local_dispatch);
  type $unit {
    field $local_receiver {}
    method $local_execute { constructor: false; arity: 0; }
    constructor $local_constructor {
      parameters { param $local_receiver_input {} }
      body { initializer { $local_receiver = $local_receiver_input; } }
    }
    method $local_execute {
      call $local_work { receiver: $local_receiver; }
    }
  }
  where $unit != $local_invoker;
  either {
    param $local_input { type: nominal($local_contract); }
    type $local_contract { method $local_slot { constructor: false; arity: 0; } }
    where subtype($unit, $local_contract);
    where $local_dispatch.name == $local_slot.name;
    where overrides($local_execute, $local_slot);
  } or {
    callable $local_caller {
      body {
        let $local_provided = construct $unit {} as $local_creation;
        call $local_registration { argument $local_provided at any; } as $local_use;
      }
    }
    where $local_registration.name == $local_register.name;
    where $local_dispatch.name == $local_execute.name;
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''

[[operations]]
id = "captured_payload"
status = "ready"
description = "A retained command passes a constructor-captured payload to work on its retained receiver."
caveat = "Explicit source contract; no proof of hidden effects, feasible paths or runtime dispatch."
query = '''
language "kql/2";
module ken.catalog.command.captured_payload;
import ken.catalog.command.variants.retained_contract;
import ken.catalog.command.retained_dispatch;

pattern detect(out GraphTerm $unit) {
  use ken.catalog.command.variants.retained_contract.detect(unit: $unit);
  use ken.catalog.command.retained_dispatch.detect(contract: $contract, slot: $slot);
  type $unit {
    field $receiver {}
    field $payload {}
    method $action {
      constructor: false;
      body {
        call $work {
          receiver: $receiver;
          unreplaced: true;
          argument $payload at any;
        } as $dispatch;
      }
    }
    constructor $initializer {
      param $receiver_input {}
      param $payload_input {}
      body {
        initializer { $receiver = $receiver_input; $payload = $payload_input; }
      }
    }
  }
  where overrides($action, $slot);
  where $payload != $receiver;
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
