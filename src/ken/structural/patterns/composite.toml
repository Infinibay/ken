schema = "ken-rule/1"
id = "composite"
name = "Composite"
category = "structural"
description = "A component iterates over children of its component contract."
caveat = "Structural evidence requires review of intent and runtime behavior."
legacy_query = "require $unit SUBTYPE_OF $component\nrequire $unit HAS_FIELD $children\nrequire $children ELEMENT_TYPE $component\nrequire $unit HAS_METHOD $operation\nrequire $operation ITERATES_CALLS $children\n"
query = '''
language "kql/2";
module ken.catalog.composite;
import ken.catalog.composite.variants.algebraic_tree;
import ken.catalog.composite.variants.higher_order_traversal;
import ken.catalog.composite.variants.recursive_contract;
import ken.catalog.composite.variants.recursive_nominal;

pattern detect(out TypeDecl $unit) {
  either {
    use ken.catalog.composite.variants.recursive_contract.detect(unit: $unit);
  } or {
    use ken.catalog.composite.variants.recursive_nominal.detect(unit: $unit);
  } or {
    use ken.catalog.composite.variants.higher_order_traversal.detect(unit: $unit);
  } or {
    use ken.catalog.composite.variants.algebraic_tree.detect(unit: $unit);
  }
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
query_language = "kql/2"
claim = "structural-signature"

[[variants]]
id = "recursive-contract"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["collection_elements", "contract_resolution", "call_targets"]
graph_requirements = ["Hoja y compuesto cumplen contrato; colección contiene componentes; operación uniforme consume resultados hijos."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
language "kql/2";
module ken.catalog.composite.variants.recursive_contract;

pattern detect(out TypeDecl $unit) {
  type $component { method $slot {} }
  type $unit {
    field $children {}
    method $operation {
      body {
        iterate $children as $child {
          body { call $slot { receiver: $child; dispatch: possible; }; }
        }
      }
    }
  }
  where subtype($unit, $component);
  where overrides($operation, $slot);
}

query results {
  use detect(unit: $unit);
  select $unit;
}
'''
