schema = "ken-rule/1"
id = "composite"
name = "Composite"
category = "structural"
description = "A component iterates over children of its component contract."
caveat = "Structural evidence requires review of intent and runtime behavior."
legacy_query = "require $unit SUBTYPE_OF $component\nrequire $unit HAS_FIELD $children\nrequire $children ELEMENT_TYPE $component\nrequire $unit HAS_METHOD $operation\nrequire $operation ITERATES_CALLS $children\n"
query = '''
query composite {
 any {
  match "composite#recursive-contract"(unit: $unit);
 } or {
  match "composite#recursive-nominal"(unit: $unit);
 } or {
  match "composite#higher-order-traversal"(unit: $unit);
 }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "recursive-contract"
status = "ready"
languages = ["python", "java", "typescript"]
requires = ["collection_elements", "contract_resolution", "call_targets"]
graph_requirements = ["Hoja y compuesto cumplen contrato; colección contiene componentes; operación uniforme consume resultados hijos."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query composite {

 require $unit SUBTYPE_OF $component;
 require $unit HAS_FIELD $children;
 require $children ELEMENT_TYPE $component;
 require $unit HAS_METHOD $operation;
 require $operation OVERRIDES $slot;
 require $operation ITERATES_CALLS $children;
 emit $unit;
}
'''
[[variants]]
id = "recursive-nominal"
status = "ready"
languages = ["go", "python", "java", "typescript", "csharp"]
requires = ["collection_elements", "iteration_receivers"]
graph_requirements = ["A nominal type stores a collection of itself; a method invokes a same-named operation on an iterated child."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"
query = '''
query recursive_nominal {
 require $unit HAS_FIELD $children;
 require $children ELEMENT_TYPE $unit;
 require $unit HAS_METHOD $operation;
 require $operation HAS_CALL $child_call;
 require $child_call ITERATED_CALL $children;
 where $operation.name == $child_call.name;
 emit $unit;
}
'''

[[variants]]
id = "algebraic-tree"
status = "design"
languages = ["typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["sum_types", "match_flow", "recursion"]
graph_requirements = ["Variante compuesta de sum type contiene hijos recursivos; evaluación uniforme incluye hojas."]
missing_capability = "unknown"
fixtures_status = "documented-not-validated"

[[variants]]
id = "higher-order-traversal"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["iteration_aggregation", "iteration_receivers"]
graph_requirements = ["Reduce/map llama la operación del componente; flujo de retorno de callback se agrega al resultado."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "La operación del componente recorre su propia colección de hijos, invoca la operación **del mismo nombre** sobre el elemento iterado, y el resultado de esa llamada se acumula en el local que la operación devuelve. La recursión la da el nombre uniforme sobre el elemento, no el tipo declarado de la colección: la forma de callback (`reduce`/`map`/`sum`) NO se resuelve todavia porque el parámetro de elemento del callback no se liga a la colección. Tampoco prueba que el elemento no se reasigne dentro del bucle, ni que todos los hijos se visiten, ni pureza de la operación."
query = '''
query composite_higher_order_traversal {
 require $unit IS CLASS;
 require $unit HAS_METHOD $operation;
 require $operation ITERATES_CALLS $iterable;
 require $child_call ITERATED_CALL $iterable;
 require $child_call RECEIVER $element;
 require $operation HAS_CALL $child_call;
 require $write ASSIGNMENT_TARGET $accumulator;
 require $write ASSIGNMENT_VALUE $child_call;
 require $operation RETURNS_STORAGE $accumulator;
 any { require $unit HAS_FIELD $iterable; }
 or {
  require $iterable RECEIVER $field;
  require $unit HAS_FIELD $field;
 }
 where $operation.name == $child_call.name;
 emit unit=$unit, $operation, $iterable, $child_call, $accumulator, $write, $element;
}
'''
