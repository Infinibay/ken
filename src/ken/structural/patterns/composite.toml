[[variants]]
id = "algebraic-tree"
status = "ready"
languages = ["typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["sum_types", "match_flow", "recursion"]
graph_requirements = ["Variante compuesta de sum type contiene hijos recursivos; evaluación uniforme incluye hojas."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-six-languages"
query_claim = "Un tipo **etiquetado** sin interfaz ni clase base: dos campos suyos estan tipados por el propio tipo (los operandos recursivos), su operacion invoca **su mismo nombre** sobre los dos, y una rama de la operacion **discrimina un campo del mismo tipo** (el tag). La recursion la da el nombre uniforme y el dispatch lo da `TRUTH_TEST` sobre la comparacion (IR 1.71); sin ese segundo hecho la query solo probaria \"un tipo con dos campos recursivos\", que es mas debil. NO se exige que los valores del tag sean distintos ni que las ramas sean exhaustivas, ni que la rama hoja no recurra, ni que los operandos no se reasignen. La codificacion de suma **por casos** (variantes de un `enum` de Rust, union discriminada de TypeScript, records de Java/C#) NO se acepta: sus casos no se modelan como tipos con campos."
query = '''
language "kql/2";
module ken.catalog.composite.variants.algebraic_tree;

pattern detect(out TypeDecl $unit, out Callable $operation, out Field $first, out Field $second, out Operation $branch, out Field $tested) {
  type $unit {
    field $first { type: nominal($unit); }
    field $second { type: nominal($unit); }
    field $tested {}
    method $operation {
      body {
        if ($tested == _) as $branch { }
        call $first_call { receiver: $first; dispatch: possible; };
        call alongside $second_call { receiver: $second; dispatch: possible; };
      }
    }
  }
  where $first != $second;
  where $operation.name == $first_call.name;
  where $operation.name == $second_call.name;
}

query results {
  use detect(unit: $unit, operation: $operation, first: $first, second: $second, branch: $branch, tested: $tested);
  select $unit, $operation, $first, $second, $branch, $tested;
}
'''

[[variants]]
id = "higher-order-traversal"
status = "ready"
languages = ["python", "javascript", "typescript", "java", "csharp", "cpp", "go", "rust"]
requires = ["iteration_aggregation", "iteration_receivers"]
graph_requirements = ["Reduce/map llama la operación del componente; flujo de retorno de callback se agrega al resultado."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-eight-languages"
query_claim = "La operación del componente recorre su propia colección de hijos, invoca la operación **del mismo nombre** sobre el elemento iterado, y el resultado de esa llamada se acumula en el local que la operación devuelve. La recursión la da el nombre uniforme sobre el elemento, no el tipo declarado de la colección: la forma de callback (`reduce`/`map`/`sum`) NO se resuelve todavia porque el parámetro de elemento del callback no se liga a la colección. Tampoco prueba que el elemento no se reasigne dentro del bucle, ni que todos los hijos se visiten, ni pureza de la operación."
query = '''
language "kql/2";
module ken.catalog.composite.variants.higher_order_traversal;

pattern detect(out TypeDecl $unit, out Callable $operation, out Field $iterable, out Call $child_call, out Value $accumulator, out Operation $write, out Binding $element) {
  type $unit {
    field $iterable {}
    method $operation {
      body {
        var $accumulator {}
        iterate $iterable as $element {
          body {
            let $child_call = call $operation { receiver: $element; dispatch: contract; rebound: true; };
            $accumulator += $child_call as $write;
          }
        }
        return $accumulator;
      }
    }
  }
}

query results {
  use detect(unit: $unit, operation: $operation, iterable: $iterable, child_call: $child_call, accumulator: $accumulator, write: $write, element: $element);
  select $unit, $operation, $iterable, $child_call, $accumulator, $write, $element;
}
'''

[[operations]]
id = "additive_aggregate"
status = "ready"
description = "A recursive nominal Composite accumulates child results and returns the accumulator, with closed explicit write counts."
caveat = "Explicit source contract; no proof of hidden effects, feasible paths or runtime dispatch."
query = '''
language "kql/2";
module ken.catalog.composite.additive_aggregate;

pattern detect(out GraphTerm $unit, out GraphTerm $operation, out GraphTerm $children) {
  type $unit {
    field $children {}
    method $operation {
      param $context { reassigned: false; }
      var $total { }
      var $value { }
      writes: exactly($total, 2);
      body {
        iterate $children as $element {
          body {
            let $child_call = call $operation { receiver: $element; dispatch: contract; rebound: true; argument $context at 0; };
            $value = $child_call;
            $total = $total + $value as $update;
          }
        }
        return $total;
      }
    }
  }
  where element_type($children, $unit);
}

query results {
  use detect(unit: $unit, operation: $operation, children: $children);
  select $unit, $operation, $children;
}
'''
