schema = "ken-rule/1"
id = "flyweight"
name = "Flyweight"
category = "structural"
description = "A pool creates, stores and returns objects through indexed lookup, or through the map's own entry API."
caveat = "Indexed insertion and direct return share a pool/key binding, and insertion retains the constructed object. Miss polarity, temporal key stability, immutability and intrinsic/extrinsic state need review. The entry variant identifies the API by name, so it inherits the usual limits of name-based protocol identification."
legacy_query = "require $unit HAS_FIELD $pool\nrequire $unit HAS_METHOD $factory\nrequire $factory LOOKS_UP $pool\nrequire $factory CREATES $product\nrequire $factory WRITES_ELEMENT $pool\nrequire $factory RETURNS_LOOKUP $pool\n"
query = '''
query flyweight {
 any { match "flyweight#explicit-interning"(unit: $unit); }
 or { match "flyweight#entry-api"(unit: $unit); }
 emit $unit;
}
'''
query_language = "kenql/1"
claim = "structural-signature"

[[variants]]
id = "explicit-interning"
status = "ready"
query_claim = "An indexed write stores the construction supplied with the key parameter, and a direct indexed return uses that same pool and key binding. The index may be the key parameter itself or a local the method derives from it (``key = self.get_key(state)``), which is how the canonical Python, TypeScript and Java examples spell the pool. Does not prove the derivation is injective -- ``get_key`` may collapse distinct inputs -- nor current key values under reassignment, miss-only creation, lifetime identity, intrinsic-state stability or extrinsic use."
languages = ["python", "java", "typescript"]
requires = ["map_key_flow", "allocation_flow"]
graph_requirements = ["Lookup/miss/inserción/retorno comparten clave y pool; usuario suministra contexto extrínseco."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix"


query = '''
query flyweight {

 require $unit HAS_FIELD $pool;
 require $unit HAS_METHOD $factory;
 require $factory LOOKS_UP $pool;
 require $factory WRITES_ELEMENT $pool;
 require $factory RETURNS_LOOKUP $pool;
 require $factory HAS_PARAMETER $key;
 parameter(receiver: false) as $key;
 require $factory HAS_CALL $construction;
 require $construction ALLOCATES_TYPE $product;
 require $construction ARGUMENT $argument;
 require $argument VALUE $input;
 require $input LOADED_FROM $key;
 require $factory HAS_OPERATION $write;
 require $write WRITES_ELEMENT $pool;
 require $write INDEX $index;
 any { where $index == $key; }
 or {
  require $index ASSIGNED_FROM $derived;
  require $derived ARGUMENT $derived_argument;
  require $derived_argument VALUE $derived_value;
  require $derived_value LOADED_FROM $key;
 }
 require $write STORES_VALUE $stored;
 any { where $stored == $construction; }
 or { require $construction RESULT $stored; }
 require $factory RETURNS $returned;
 require $returned CONTAINER $pool;
 require $returned INDEX $return_index;
 any { where $return_index == $key; }
 or {
  require $return_index ASSIGNED_FROM $return_derived;
  require $return_derived ARGUMENT $return_argument;
  require $return_argument VALUE $return_value;
  require $return_value LOADED_FROM $key;
 }
 emit $unit;
}
'''
[[variants]]
id = "entry-api"
status = "ready"
languages = ["java", "csharp", "cpp", "rust"]
requires = ["map_api_models", "callback_flow"]
graph_requirements = ["Modelo entry/get-or-add preserva identidad de clave y objeto retenido; no afirmar factory exactly-once."]
missing_capability = "unknown"
fixtures_status = "source-regression-matrix-four-languages"
query_claim = "Un metodo de una clase con un campo pool llama a un API de entrada reconocido por nombre (`computeIfAbsent`, `GetOrAdd`, `try_emplace`, `insert_or_assign`, `entry`) cuyo receptor es ESE campo y cuyo argumento en posicion 0 proviene del parametro clave del metodo; ademas el metodo devuelve el objeto retenido, sea la propia llamada, un miembro suyo (la forma encadenada de C++ sobre un `pair`) o el envoltorio `or_insert_with` cuyo receptor es la llamada de entrada (Rust). `no afirmar factory exactly-once`: la variante no cuenta invocaciones del factory ni prueba que la construccion ocurra una sola vez, solo que el API de entrada es el que retiene el objeto. La identificacion del API es por nombre, no por resolucion de biblioteca. No prueba identidad de clave bajo reasignacion, estabilidad temporal del pool ni estado intrinseco/extrinseco."
query = '''
query entry_api {
 require $unit HAS_FIELD $pool;
 require $unit HAS_METHOD $lookup;
 callable(constructor: false) as $lookup;
 require $lookup HAS_PARAMETER $key;
 parameter(receiver: false) as $key;
 require $lookup HAS_CALL $entry;
 any { call(name: "computeIfAbsent") as $entry; }
 or { call(name: "GetOrAdd") as $entry; }
 or { call(name: "try_emplace") as $entry; }
 or { call(name: "insert_or_assign") as $entry; }
 or { call(name: "entry") as $entry; }
 require $entry RECEIVER $pool;
 require $entry ARGUMENT $argument;
 require $argument ENTITY ARGUMENT [position: 0, kind: positional];
 require $argument VALUE $value;
 require $value LOADED_FROM $key;
 require $lookup RETURNS $returned;
 any { path $returned MEMBER_OF{0,2} $entry as $retained_path; }
 or { require $returned RECEIVER $entry; }
 emit unit=$unit, $pool, $lookup, $entry, $key;
}
'''
