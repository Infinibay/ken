[package]
name = "ken-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "ken-rs"
path = "src/main.rs"

[dependencies]
ken-core = { path = "../ken-core" }
ken-search = { path = "../ken-search" }
ken-retrieval = { path = "../ken-retrieval" }
ken-text = { path = "../ken-text" }
ken-syntax = { path = "../ken-syntax" }
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true

[dev-dependencies]
base64 = "0.23.1"
ken-index = { path = "../ken-index" }
ken-store = { path = "../ken-store" }
flate2.workspace = true
sha2.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
