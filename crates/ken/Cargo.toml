[package]
name = "ken"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ken"
path = "src/main.rs"

[features]
default = ["postgres", "fastembed", "code", "pdf", "git"]
postgres = ["engine/postgres"]
fastembed = ["engine/fastembed"]
code = ["engine/code"]
pdf = ["engine/pdf"]
git = ["engine/git"]

[dependencies]
engine.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
base64.workspace = true
ureq.workspace = true
url.workspace = true
# Aggressive allocator that returns freed memory to the OS far better
# than glibc malloc — matters for long ingests where Rust drops chunks/
# embeddings per-file but glibc keeps the arenas, growing RSS unbounded.
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
http-body-util = "0.1"
base64.workspace = true
