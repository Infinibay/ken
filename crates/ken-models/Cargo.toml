[package]
name = "ken-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ken-native-model-api = { path = "../ken-native-model-api" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
ring.workspace = true
tokenizers.workspace = true
onig.workspace = true
safetensors.workspace = true
half.workspace = true
npyz.workspace = true
zip.workspace = true
ndarray.workspace = true
py_literal.workspace = true
tempfile.workspace = true
libloading.workspace = true
rustix = { version = "=1.1.5", features = ["fs"] }
ort.workspace = true
ct2rs.workspace = true
sentencepiece.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { workspace = true, features = ["accelerate"] }

[target.'cfg(target_os = "linux")'.dependencies]
ct2rs = { workspace = true, features = ["openblas", "openmp-runtime-comp"] }
openblas-src.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
