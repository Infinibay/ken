[package]
name = "ken-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[features]
default = []
postgres = ["dep:sqlx", "dep:pgvector", "dep:tokio", "dep:ignore"]
fastembed = ["dep:fastembed"]
code = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-ruby",
]
pdf = ["dep:pdf-extract"]
git = ["dep:git2", "postgres", "code"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ahash.workspace = true
blake3.workspace = true
ulid.workspace = true
statrs.workspace = true
ordered-float.workspace = true
pulldown-cmark.workspace = true

# postgres backend
sqlx = { workspace = true, optional = true }
pgvector = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# production embedder
fastembed = { workspace = true, optional = true }

# code adapter (tree-sitter)
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }

# pdf adapter
pdf-extract = { workspace = true, optional = true }

# git history ingest
git2 = { workspace = true, optional = true }

# filesystem walker for `ingest-codebase` (respects .gitignore). Required by
# the postgres-backed entrypoint, so gated under that feature.
ignore = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "adapters"
harness = false
required-features = ["code", "pdf"]

[[bench]]
name = "rank_math"
harness = false
