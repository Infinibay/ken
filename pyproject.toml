[project]
name = "ken-rank"
# Single-sourced from src/ken/__init__.py — see [tool.hatch.version]. Keeping a
# literal here as well is what shipped 0.5.0 and 0.7.0 with `ken --version`
# reporting the *previous* release: two places to bump, one of them easy to miss.
dynamic = ["version"]
description = "Per-project context-rank index for Claude Code, served from a local daemon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andres" }]
dependencies = [
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    # Dart has no standalone tree-sitter wheel on PyPI; the language-pack
    # bundles the grammar (and pins tree-sitter>=0.25.2, hence the bump above).
    "tree-sitter-language-pack>=1.8",
    "pathspec>=0.12",
    "watchfiles>=0.22",
    # fastembed brings ONNX Runtime + a managed all-MiniLM-L6-v2 download
    # (~25 MB cached in ~/.cache/fastembed on first use). 384-dim, fast on
    # CPU; same model infinidev runs in production.
    "fastembed>=0.5",
    "numpy>=1.26",
    # MCP SDK — exposes ken's tools to Claude Code over stdio.
    # Pinned to the 2.x line: 2.0 removed the high-level ``FastMCP``
    # decorator surface (``mcp.server.fastmcp``) and our server now uses
    # the low-level ``mcp.server.Server`` API directly.
    "mcp>=2.0",
]

[project.optional-dependencies]
# GPU embedding for the default (fastembed) backend. `pip install
# ken-rank[gpu]` swaps in fastembed's GPU build (it pulls onnxruntime-gpu).
# The embedder then auto-detects a CUDA/ROCm provider and uses it, falling
# back to CPU when none is usable — so this extra is purely opt-in
# acceleration and never a hard requirement. The pulled onnxruntime-gpu
# targets a specific CUDA major; if it does not match the host's CUDA
# runtime, ken logs a warning and stays on CPU rather than failing. Pin
# onnxruntime-gpu yourself if you need a specific CUDA line.
#
# Not installable on macOS: onnxruntime-gpu publishes Linux and Windows wheels
# only, so without the marker `pip install 'ken-rank[gpu]'` fails outright on a
# Mac. There is nothing to offer instead — ONNX Runtime has no MPS provider, so
# the fastembed backend stays on the CPU there (where its small models are
# already fast). Apple Silicon GPU acceleration lives in the `torch` extra.
gpu = ["fastembed-gpu>=0.5; sys_platform != 'darwin'"]

# The torch backend: `pip install ken-rank[torch]` adds sentence-transformers
# (which pulls torch) so ken can run stronger models fastembed does not ship —
# e.g. Qwen/Qwen3-Embedding-0.6B (top of ken's retrieval benchmark) or
# BAAI/bge-m3. Heavier install; entirely opt-in. Switch a project onto one
# with `ken reembed --model <name>` after installing this extra. Also
# GPU-aware: CUDA, or Apple Silicon's MPS, whichever torch sees.
#
# The two version floors are not cosmetic. sentence-transformers only requires
# transformers>=4.34, but the Qwen3 architecture landed in 4.51 — below it the
# model dies with `KeyError: 'qwen3'`, naming neither the cause nor the fix. And
# torch below 2.9 could return silently wrong embeddings on MPS (pytorch#163597,
# fixed in 2.9.0), so Apple Silicon gets a floor that costs Linux users nothing;
# it is scoped to arm64 because PyPI has no torch 2.9 for Intel Macs, where MPS
# does not exist anyway.
torch = [
    "sentence-transformers>=3.0",
    "transformers>=4.51",
    "torch>=2.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
ken = "ken.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The one place the version lives. hatchling reads __version__ out of this file
# at build time, so the package metadata and what `ken --version` prints cannot
# disagree — they are the same string.
[tool.hatch.version]
path = "src/ken/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ken"]

[tool.hatch.build.targets.sdist]
include = ["src/ken", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
