[project]
name = "ken"
version = "0.1.1"
description = "Per-project context-rank index for Claude Code, served from a local daemon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andres" }]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "pathspec>=0.12",
    "watchfiles>=0.22",
    # fastembed brings ONNX Runtime + a managed all-MiniLM-L6-v2 download
    # (~25 MB cached in ~/.cache/fastembed on first use). 384-dim, fast on
    # CPU; same model infinidev runs in production.
    "fastembed>=0.5",
    "numpy>=1.26",
    # MCP SDK — exposes ken's tools to Claude Code over stdio.
    "mcp>=1.0",
]

[project.scripts]
ken = "ken.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
