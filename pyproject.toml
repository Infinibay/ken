[project]
name = "ken"
version = "0.1.0"
description = "Per-project context-rank index for Claude Code, served from a local daemon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andres" }]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "pathspec>=0.12",
    "watchfiles>=0.22",
]

[project.scripts]
ken = "ken.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ken"]
